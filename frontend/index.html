<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TeachFlow — Instructor workspace</title>
  <style>
    :root{--canvas:#f5f3ec;--surface:#fffefa;--muted:#efeee7;--text:#252b2a;--sub:#747975;--border:#e2e0d7;--sage:#708a7b;--sage-soft:#e1eae3;--blue:#789bb8;--blue-soft:#e2ebf2;--lav:#9690b7;--lav-soft:#ebe8f3;--terra:#ba7457;--terra-soft:#f3e4dc;--node:#a4a5a3;--focus:#567f9e;--shadow:0 12px 36px #252b2a12;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--canvas)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #567f9e55;outline-offset:2px}.app{min-height:100vh;display:grid;grid-template-columns:228px minmax(0,1fr)}.sidebar{background:#faf9f4;border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;font-weight:650;font-size:18px;padding:0 10px 30px}.brandmark{width:30px;height:30px;border-radius:10px;background:var(--sage);color:white;display:grid;place-items:center;font-size:17px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:9px;color:var(--sub);display:flex;gap:12px;align-items:center}.nav button.active{background:var(--sage-soft);color:#3f584a}.nav .ico{font-size:17px;width:18px;text-align:center}.side-bottom{margin-top:auto}.help{padding:15px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--sub);font-size:12px}.help strong{display:block;color:var(--text);font-size:13px;margin-bottom:5px}.main{min-width:0}.topbar{height:68px;border-bottom:1px solid var(--border);background:#faf9f4cc;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px}.top-left,.top-right{display:flex;align-items:center;gap:12px}.select{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px 12px;max-width:230px}.profile{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--lav-soft);color:#625d7c;font-weight:600}.content{padding:34px clamp(20px,4vw,64px);max-width:1500px;margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.1em;color:var(--sub);font-size:11px;font-weight:650}.page-title{font-size:30px;line-height:1.2;letter-spacing:-.025em;margin:7px 0 8px;font-weight:620}.muted{color:var(--sub)}.small{font-size:12px}.btn{border:1px solid var(--border);background:var(--surface);padding:10px 15px;border-radius:9px;font-weight:550;transition:.18s}.btn:hover{border-color:#b8c2ba;background:white}.btn.primary{background:var(--sage);border-color:var(--sage);color:white}.btn.primary:hover{background:#5f7869}.btn:disabled{opacity:.5;cursor:not-allowed}.empty{min-height:calc(100vh - 136px);display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,.68fr);align-items:center;gap:50px}.empty h1{font-size:clamp(34px,4vw,50px);font-weight:570;line-height:1.12;letter-spacing:-.04em;max-width:570px;margin:14px 0}.empty p{font-size:16px;color:var(--sub);max-width:530px}.actions{display:flex;gap:10px;margin:25px 0 36px}.steps{display:flex;gap:24px;flex-wrap:wrap;color:var(--sub);font-size:12px}.stepmini{display:flex;gap:9px;align-items:center}.stepnum{width:24px;height:24px;display:grid;place-items:center;background:var(--sage-soft);color:var(--sage);border-radius:50%;font-variant-numeric:tabular-nums}.preview{height:320px;position:relative;border:1px solid var(--border);border-radius:18px;background:var(--surface);overflow:hidden;display:grid;place-items:center}.preview svg{width:100%;height:100%}.preview-label{position:absolute;bottom:18px;left:20px;color:var(--sub);font-size:12px}.wizard-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px;gap:16px}.stepper{display:flex;gap:4px;overflow:auto;margin:22px 0 28px}.step-pill{padding:9px 12px;border-radius:8px;color:var(--sub);white-space:nowrap;font-size:12px}.step-pill.current{background:var(--sage-soft);color:#40594b;font-weight:600}.step-pill.done{color:var(--sage)}.panel{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:25px;box-shadow:0 3px 12px #252b2a06}.form{max-width:780px;margin:0 auto}.form h2{font-size:23px;font-weight:580;margin:0 0 5px}.form>p{margin:0 0 23px;color:var(--sub)}.field{display:grid;gap:7px;margin:16px 0}.field label{font-weight:550;font-size:13px}.field label span{color:var(--sub);font-weight:400}.field input,.field textarea,.field select,.group input,.group select,.group textarea{width:100%;border:1px solid var(--border);background:#fffefa;border-radius:9px;padding:11px 12px}.field textarea{min-height:84px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wizard-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.group{border:1px solid var(--border);border-radius:12px;padding:15px;background:#fffefa}.group-top{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}.group input{padding:8px 9px;margin:5px 0}.group .remove{border:0;background:none;color:var(--sub)}.upload{border:1px dashed #c9c9be;border-radius:13px;text-align:center;padding:28px;color:var(--sub);background:#faf9f4}.files{display:grid;gap:8px;margin-top:14px}.file{display:flex;align-items:center;gap:11px;background:#faf9f4;border:1px solid var(--border);padding:10px 12px;border-radius:9px}.file-icon{width:32px;height:36px;border-radius:7px;background:var(--blue-soft);display:grid;place-items:center;color:#557894;font-size:11px;font-weight:700}.file-info{flex:1;min-width:0}.file-info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;color:var(--sage)}.file button{border:0;background:none;color:var(--sub)}.roadmap-layout{display:flex;gap:18px;align-items:stretch;min-height:560px}.roadmap-card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:15px;overflow:hidden;position:relative}.roadmap-tools{position:absolute;right:15px;top:15px;z-index:2;display:flex;gap:5px}.iconbtn{width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:8px}.roadmap-scroll{height:100%;min-height:560px;overflow:auto;cursor:grab}.roadmap-scroll:active{cursor:grabbing}.roadmap-inner{position:relative;width:900px;height:540px;transform-origin:top left}.roadmap-inner svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edge{fill:none;stroke:#d8d9d0;stroke-width:2}.node{position:absolute;transform:translate(-50%,-50%);width:142px;min-height:76px;border:1px solid var(--border);border-radius:13px;background:#fffefa;padding:10px;cursor:pointer;text-align:left;box-shadow:0 2px 9px #2221}.node:hover{transform:translate(-50%,-50%) scale(1.03)}.node.selected{outline:3px solid #789bb844;border-color:var(--blue)}.node .nmeta{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-bottom:5px}.node strong{display:block;font-size:12px;line-height:1.3}.node.done{background:var(--sage-soft);border-color:#cfddd1}.node.active{background:var(--blue-soft);border-color:#bfd0dc;box-shadow:0 0 0 6px #789bb81b}.node.attention{background:var(--terra-soft);border-color:#e7c9ba}.node.optional{background:var(--lav-soft);border-color:#dad6e7}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--sub);font-size:11px;margin:13px 0}.legend span{display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--node)}.dot.done{background:var(--sage)}.dot.active{background:var(--blue)}.dot.attn{background:var(--terra)}.detail{width:360px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:20px;position:relative}.detail h3{margin:8px 0;font-size:20px;font-weight:590}.detail-section{border-top:1px solid var(--border);padding:14px 0}.detail-section h4{font-size:12px;color:var(--sub);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}.detail ul{padding-left:19px;margin:0}.detail li{margin:5px 0}.badge{display:inline-block;background:var(--blue-soft);color:#526f86;border-radius:20px;padding:4px 9px;font-size:11px}.summary{display:flex;gap:10px;margin:15px 0}.metric{flex:1;padding:11px;background:#faf9f4;border-radius:10px}.metric strong{display:block;font-size:18px;font-variant-numeric:tabular-nums}.toast{position:fixed;bottom:20px;right:22px;background:#34463b;color:white;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:20}.overlay{position:fixed;inset:0;background:#252b2a55;display:grid;place-items:center;padding:18px;z-index:10}.modal{max-width:470px;background:var(--surface);padding:25px;border-radius:15px;box-shadow:var(--shadow)}.modal h2{margin-top:0}.progress{height:5px;background:var(--muted);border-radius:6px;overflow:hidden;margin:15px 0}.progress i{display:block;height:100%;background:var(--sage);transition:width .3s}.warning{background:var(--terra-soft);color:#81513e;padding:10px 12px;border-radius:9px;font-size:12px;margin:14px 0}.hide{display:none!important}.mobile-menu{display:none}@media(max-width:900px){.app{grid-template-columns:68px minmax(0,1fr)}.sidebar{padding:20px 9px}.brand{padding:0 9px 25px}.brand span:last-child,.nav button span:last-child,.help{display:none}.nav button{justify-content:center;padding:12px 8px}.side-bottom{display:none}.content{padding:24px 20px}.detail{width:310px}.empty{gap:22px}}@media(max-width:650px){.app{display:block}.sidebar{display:none}.topbar{padding:0 14px;height:58px}.select{max-width:145px;padding:7px;font-size:12px}.top-right .muted{display:none}.content{padding:20px 14px}.empty{grid-template-columns:1fr;min-height:unset;padding:32px 0}.preview{height:190px;grid-row:1}.empty h1{font-size:37px}.steps{gap:11px}.row{grid-template-columns:1fr}.panel{padding:18px}.stepper{margin:14px 0 18px}.roadmap-layout{display:block}.roadmap-card{min-height:440px}.roadmap-scroll{min-height:440px}.detail{width:auto;margin-top:12px}.wizard-head{display:block}.wizard-footer{position:sticky;bottom:0;background:var(--canvas);padding:10px 0}.page-title{font-size:25px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{'use strict';
const KEY='teachflow.prototype.v1';
const demo={id:'py-course',ownerId:'instructor',name:'Python Development',description:'A practical path from Python foundations to APIs, databases, and applied AI.',learnerLevel:'Beginner',learningGoals:['Build Python applications','Understand APIs and databases','Create a small RAG project'],status:'active',groups:[{id:'g-sat',name:'Saturday Group',schedule:'Saturday · 10:00',startDate:'2026-09-05',status:'active'},{id:'g-mon',name:'Monday Evening',schedule:'Monday · 18:30',startDate:'2026-09-07',status:'active'}],materials:[{id:'m1',filename:'Python_Foundations.pdf',mimeType:'application/pdf',sizeBytes:2048000,status:'processed'},{id:'m2',filename:'API_Workshop.pptx',mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation',sizeBytes:4300800,status:'processed'}],topics:[{id:'t1',title:'Python Basics',minutes:120},{id:'t2',title:'Control Flow',minutes:90},{id:'t3',title:'Functions',minutes:120},{id:'t4',title:'OOP Concepts',minutes:120},{id:'t5',title:'Classes & Inheritance',minutes:120},{id:'t6',title:'Git Essentials',minutes:90},{id:'t7',title:'Working with APIs',minutes:120},{id:'t8',title:'FastAPI',minutes:150},{id:'t9',title:'Databases',minutes:150},{id:'t10',title:'Final RAG Project',minutes:180}],edges:[['t1','t2'],['t2','t3'],['t3','t4'],['t4','t5'],['t3','t6'],['t3','t7'],['t7','t8'],['t8','t9'],['t9','t10'],['t8','t10']],progress:{'g-sat':['t1','t2','t3','t4'],'g-mon':['t1','t2']},attention:'t9',version:1};
const defaultState=()=>({courses:[],draft:null,screen:'dashboard',selectedCourse:null,selectedGroup:null,selectedNode:null,showDetail:false,toast:'',generationTimer:null,groupText:'',extractPreview:null,files:[],genFailure:false,step:1});
let state={...defaultState(),...(safeLoad()||{})};let toastTimer;
function safeLoad(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');return v&&v.version===1?{courses:v.courses||[],draft:v.draft||null,selectedCourse:v.selectedCourse||null,selectedGroup:v.selectedGroup||null}:null}catch{return null}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:1,courses:state.courses,draft:state.draft,selectedCourse:state.selectedCourse,selectedGroup:state.selectedGroup}))}catch{}}
function escape(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Math.random().toString(36).slice(2,10)}
function selectedCourse(){return state.courses.find(c=>c.id===state.selectedCourse)||null}
function group(){const c=selectedCourse();return c?.groups.find(g=>g.id===state.selectedGroup)||c?.groups[0]||null}
function notify(msg){state.toast=msg;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render()},2600)}
const topicsDefault=()=>[
 {id:id(),title:'Python Basics',description:'Types, expressions, and the Python environment.',objectives:['Use variables and core types','Run a Python script'],minutes:120},
 {id:id(),title:'Control Flow',description:'Make programs respond to data and conditions.',objectives:['Use conditionals','Repeat work with loops'],minutes:90},
 {id:id(),title:'Functions',description:'Package reusable behavior with parameters and return values.',objectives:['Define and call functions','Use parameters and return values'],minutes:120},
 {id:id(),title:'OOP Concepts',description:'Model related data and behavior with objects.',objectives:['Explain classes and objects','Choose when to use object-oriented design'],minutes:120},
 {id:id(),title:'Classes & Inheritance',description:'Build class hierarchies and extend existing behavior.',objectives:['Define classes','Use inheritance carefully'],minutes:120},
 {id:id(),title:'Git Essentials',description:'Track code changes and collaborate with version control.',objectives:['Commit changes','Work with branches'],minutes:90},
 {id:id(),title:'Working with APIs',description:'Send requests and work with structured responses.',objectives:['Make HTTP requests','Handle JSON responses'],minutes:120},
 {id:id(),title:'FastAPI',description:'Build a small typed web API in Python.',objectives:['Create API routes','Validate request data'],minutes:150},
 {id:id(),title:'Databases',description:'Persist application data with relational models.',objectives:['Model related data','Read and write records'],minutes:150},
 {id:id(),title:'Final RAG Project',description:'Combine APIs and stored data in a small retrieval-assisted project.',objectives:['Connect course concepts','Present a working project'],minutes:180}];
const defaultEdges=topics=>[[0,1],[1,2],[2,3],[3,4],[2,5],[2,6],[6,7],[7,8],[8,9],[7,9]].map(([a,b])=>[topics[a].id,topics[b].id]);
function createDraft(){if(state.draft){openDraft();return}state.draft={id:id(),name:'',description:'',learnerLevel:'',learningGoals:'',duration:'',groups:[],materials:[],topics:[],edges:[],status:'draft',step:1,createdAt:new Date().toISOString()};state.files=[];state.screen='wizard';state.step=1;render()}
function openDraft(){if(!state.draft)createDraft();else{state.screen='wizard';state.step=state.draft.step||1;render()}}
function sidebar(){return `<aside class="sidebar"><div class="brand"><span class="brandmark">↗</span><span>TeachFlow</span></div><nav class="nav"><button class="${state.screen==='dashboard'?'active':''}" data-action="dashboard"><span class="ico">⌂</span><span>Dashboard</span></button><button class="${state.screen==='roadmap'?'active':''}" data-action="courses"><span class="ico">▧</span><span>Courses</span></button><button class="${state.screen==='roadmap'?'active':''}" data-action="roadmap"><span class="ico">⌁</span><span>Roadmap</span></button><button data-action="groups"><span class="ico">◷</span><span>Groups</span></button><button data-action="materials"><span class="ico">▤</span><span>Materials</span></button><button data-action="approvals"><span class="ico">✓</span><span>Approvals</span></button></nav><div class="side-bottom"><div class="help"><strong>Thoughtful planning, less admin</strong>Turn the material you already teach into a plan you can review and shape.</div></div></aside>`}
function topbar(){const c=selectedCourse();return `<header class="topbar"><div class="top-left">${state.courses.length?`<select class="select" id="course-select" aria-label="Select course">${state.courses.map(x=>`<option value="${x.id}" ${x.id===state.selectedCourse?'selected':''}>${escape(x.name)}</option>`).join('')}</select>${c?.groups.length?`<select class="select" id="group-select" aria-label="Select group">${c.groups.map(g=>`<option value="${g.id}" ${g.id===state.selectedGroup?'selected':''}>${escape(g.name)}</option>`).join('')}</select>`:''}`:`<span class="muted small">Instructor workspace</span>`}</div><div class="top-right"><span class="muted small">Instructor</span><div class="profile" aria-label="Instructor profile">I</div></div></header>`}
function empty(){return `<section class="empty"><div><div class="eyebrow">A calmer way to plan your teaching</div><h1>Your next course starts here.</h1><p>Add your teaching materials and let TeachFlow turn them into a structured roadmap, ready for your review.</p><div class="actions"><button class="btn primary" data-action="create">Create your first course <span aria-hidden="true">→</span></button><button class="btn" data-action="how">See how it works</button></div><div class="steps"><div class="stepmini"><span class="stepnum">1</span>Add course information</div><div class="stepmini"><span class="stepnum">2</span>Add teaching materials</div><div class="stepmini"><span class="stepnum">3</span>Review and approve</div></div><div class="small muted" style="margin-top:22px"><button class="btn" data-action="sample">Explore sample course</button> <span>Uses local demonstration data.</span></div></div><div class="preview" aria-label="Muted roadmap preview"><svg viewBox="0 0 420 300"><path d="M55 210 C80 210 83 80 145 80 S205 220 254 220 S305 100 365 110" fill="none" stroke="#dedfd6" stroke-width="3" stroke-dasharray="4 7"/><circle cx="55" cy="210" r="18" fill="#e1eae3" stroke="#708a7b"/><circle cx="145" cy="80" r="18" fill="#e2ebf2" stroke="#789bb8"/><circle cx="254" cy="220" r="18" fill="#efeee7" stroke="#a4a5a3"/><circle cx="365" cy="110" r="18" fill="#efeee7" stroke="#a4a5a3"/><circle cx="55" cy="210" r="4" fill="#708a7b"/><circle cx="145" cy="80" r="4" fill="#789bb8"/><circle cx="254" cy="220" r="4" fill="#a4a5a3"/><circle cx="365" cy="110" r="4" fill="#a4a5a3"/></svg><span class="preview-label">A learning path shaped around your course</span></div></section>`}
function stepper(){const labels=['Course details','Groups & schedule','Materials','Generate roadmap','Review & approve'];return `<div class="stepper">${labels.map((x,i)=>`<div class="step-pill ${state.step===i+1?'current':state.step>i+1?'done':''}">${state.step>i+1?'✓ ':''}${i+1} ${x}</div>`).join('')}</div>`}
function step1(){const d=state.draft;return `<div class="panel form"><h2>Tell us about your course.</h2><p>Start with what you teach. TeachFlow will use this information together with your materials to propose a roadmap.</p><div class="field"><label for="name">Course name <span>Required</span></label><input id="name" value="${escape(d.name)}" placeholder="What course do you teach?" autocomplete="off"/><small class="small muted">Example: Python Development</small></div><div class="field"><label for="desc">Short description <span>Optional</span></label><textarea id="desc" placeholder="Describe the course in one sentence...">${escape(d.description)}</textarea></div><div class="row"><div class="field"><label for="level">Learner level <span>Optional</span></label><select id="level"><option value="">Select level</option>${['Beginner','Intermediate','Advanced','Mixed / not sure'].map(x=>`<option ${d.learnerLevel===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="duration">Course duration <span>Optional</span></label><input id="duration" value="${escape(d.duration)}" placeholder="e.g. 8 weeks or Oct–Dec"/></div></div><div class="field"><label for="goals">Learning goals <span>Optional</span></label><textarea id="goals" placeholder="One goal per line, or separate goals with commas">${escape(d.learningGoals)}</textarea><small class="small muted">A few goals help shape sessions. You can leave this blank.</small></div></div>`}
function groupCard(g,i){return `<div class="group" data-group="${g.id}"><div class="group-top"><strong>Group ${i+1}</strong><button class="remove" data-action="remove-group" data-id="${g.id}" aria-label="Remove group">Remove</button></div><input data-gfield="name" value="${escape(g.name)}" placeholder="Group name" aria-label="Group name"/><input data-gfield="schedule" value="${escape(g.schedule)}" placeholder="Days and start time · optional" aria-label="Meeting schedule"/><div class="row"><input data-gfield="duration" type="number" min="1" value="${escape(g.duration||'')}" placeholder="Minutes" aria-label="Session duration in minutes"/><input data-gfield="start" type="date" value="${escape(g.startDate||'')}" aria-label="Course start date"/></div></div>`}
function step2(){return `<div class="panel form"><h2>How do you teach this course?</h2><p>Set up your teaching groups. They can follow the same roadmap at different speeds and on different schedules.</p><div class="field"><label for="scheduleText">Describe your schedule <span>Optional</span></label><textarea id="scheduleText" placeholder="Example: I teach Python to four groups. Two meet on Saturday, and two meet on Monday. Each session lasts two hours.">${escape(state.groupText)}</textarea><button class="btn" data-action="extract" style="justify-self:start">Extract schedule details</button></div>${state.extractPreview?`<div class="warning">Mock extraction preview — review and edit these suggestions before adding them.<div style="margin-top:9px"><button class="btn" data-action="accept-extract">Add suggested groups</button> <button class="btn" data-action="clear-extract">Dismiss</button></div></div>`:''}<div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px"><strong>Groups <span class="muted small">(${state.draft.groups.length})</span></strong><button class="btn" data-action="add-group">＋ Add group</button></div><div class="groups">${state.draft.groups.map(groupCard).join('')||`<div class="muted small">No groups yet. You can add groups later.</div>`}</div><div class="panel" style="margin-top:18px;background:#faf9f4;padding:14px"><strong>Already using a calendar?</strong><div class="small muted" style="margin:4px 0 10px">Calendar connection is not available in this prototype.</div><button class="btn" disabled title="Calendar integration is not connected">Connect calendar · unavailable</button></div></div>`}
function step3(){const files=state.draft.materials;return `<div class="panel form"><h2>Bring your teaching materials.</h2><p>TeachFlow uses your existing content to build a roadmap grounded in what you actually teach.</p><label class="upload" for="file-input" style="display:block;cursor:pointer"><div style="font-size:27px;margin-bottom:5px">▤</div><strong>Drop your files here or browse files.</strong><div class="small" style="margin-top:5px">PDF, DOCX, PPTX, TXT, Markdown, Python, Jupyter · up to 25 MB each</div><input type="file" id="file-input" multiple accept=".pdf,.docx,.pptx,.txt,.md,.py,.ipynb" hidden/></label><div class="files">${files.map((f,i)=>`<div class="file"><div class="file-icon">${escape(f.ext.toUpperCase())}</div><div class="file-info"><strong>${escape(f.name)}</strong><span class="small muted">${formatBytes(f.size)} · <span class="status">${escape(f.status)}</span></span></div><button data-action="remove-file" data-index="${i}" aria-label="Remove ${escape(f.name)}">×</button></div>`).join('')||'<p class="small muted">No materials selected. You can continue with your course description and learning goals.</p>'}</div><div class="small muted" style="margin-top:18px">Files remain in this browser prototype only. Content extraction and secure server upload are not connected; selection does not mean a file was processed.</div></div>`}
function formatBytes(n){if(!n)return '0 B';let k=1024,u=['B','KB','MB','GB'],i=Math.floor(Math.log(n)/Math.log(k));return `${(n/Math.pow(k,i)).toFixed(i?1:0)} ${u[i]}`}
function roadmapSvg(topics,edges,positions){return `<svg viewBox="0 0 900 540" aria-hidden="true">${edges.map(([a,b])=>{let p=positions[a],q=positions[b];if(!p||!q)return '';let dx=q.x-p.x,dy=q.y-p.y;return `<path class="edge" d="M ${p.x} ${p.y} C ${p.x+dx*.42} ${p.y+dy*.1}, ${q.x-dx*.42} ${q.y-dy*.1}, ${q.x} ${q.y}"/>`}).join('')}</svg>`}
function positionsFor(topics){let p={};const coords=[[105,116],[310,116],[510,116],[710,116],[710,320],[510,320],[310,320],[105,320],[105,470],[310,470],[510,470],[710,470]];topics.forEach((t,i)=>p[t.id]=coords[i]||{x:100+(Math.floor(i/4)%2?600:0)+(i%4)*70,y:80+Math.floor(i/4)*160});return p}
function topicStatus(t,c,g){if(c?.attention===t.id)return 'attention';let done=(c?.progress?.[g?.id]||[]).includes(t.id);if(done)return 'done';let pg=c?.progress?.[g?.id]||[];let edges=c?.edges||[];let available=(edges.filter(e=>e[1]===t.id).every(e=>pg.includes(e[0])));return available?'active':'upcoming'}
function roadmapCanvas(topics,edges,c,grp,editable=false){const positions=positionsFor(topics);return `<div class="roadmap-card"><div class="roadmap-tools"><button class="iconbtn" data-action="zoom-out" aria-label="Zoom out">−</button><button class="iconbtn" data-action="zoom-in" aria-label="Zoom in">＋</button><button class="iconbtn" data-action="fit" aria-label="Fit roadmap">⌗</button></div><div class="roadmap-scroll" id="roadmap-scroll"><div class="roadmap-inner" id="roadmap-inner">${roadmapSvg(topics,edges,positions)}${topics.map((t,i)=>{let p=positions[t.id],s=editable?'upcoming':topicStatus(t,c,grp);return `<button class="node ${s} ${state.selectedNode===t.id?'selected':''}" style="left:${p.x}px;top:${p.y}px" data-action="select-node" data-id="${t.id}" aria-label="Session ${i+1}: ${escape(t.title)}, ${s}"><span class="nmeta"><span>${String(i+1).padStart(2,'0')}</span><span>${s==='done'?'✓':s==='active'?'◉':s==='attention'?'!':s==='upcoming'?'○':'◇'} ${s==='done'?'Complete':s==='active'?'In progress':s==='attention'?'Review':s}</span></span><strong>${escape(t.title)}</strong><span class="small muted">${t.minutes||90} min</span></button>`}).join('')}</div></div></div>`}
function detailPanel(t,i,topics,edges,editable,c){if(!t)return `<aside class="detail"><span class="muted small">Select a session node to see its details.</span></aside>`;const pred=edges.filter(e=>e[1]===t.id).map(e=>topics.find(x=>x.id===e[0])?.title).filter(Boolean);const successors=edges.filter(e=>e[0]===t.id).map(e=>topics.find(x=>x.id===e[1])?.title).filter(Boolean);const materials=c?.materials||state.draft?.materials||[];return `<aside class="detail"><div class="eyebrow">Session ${String(i+1).padStart(2,'0')} · ${topics.length} sessions</div>${editable?`<div class="field"><label>Session title</label><input id="edit-title" data-id="${t.id}" value="${escape(t.title)}"/></div>`:`<h3>${escape(t.title)}</h3>`}<span class="badge">${editable?'Proposed session':topicStatus(t,c,group())}</span>${editable?`<div class="field"><label>What will be taught</label><textarea id="edit-desc" data-id="${t.id}">${escape(t.description||'')}</textarea></div>`:`<div class="detail-section"><h4>What will be taught</h4><div>${escape(t.description||'Build understanding and practice through guided exercises.')}</div></div>`}<div class="detail-section"><h4>Learning objectives</h4>${editable?`<textarea id="edit-objectives" data-id="${t.id}">${escape((t.objectives||[]).join('\n'))}</textarea>`:`<ul>${(t.objectives||['Understand core ideas','Apply concepts in practice']).map(x=>`<li>${escape(x)}</li>`).join('')}</ul>`}</div><div class="detail-section"><h4>Prerequisites</h4>${editable?`<div class="small muted">Select prerequisites (must remain acyclic)</div>${topics.filter(x=>x.id!==t.id).map(x=>`<label class="small" style="display:block;margin:5px 0"><input type="checkbox" data-prereq="${x.id}" ${edges.some(e=>e[0]===x.id&&e[1]===t.id)?'checked':''}/> ${escape(x.title)}</label>`).join('')}`:`${pred.map(escape).join(', ')||'No prerequisites'}${successors.length?`<div class="small muted" style="margin-top:6px">Unlocks: ${successors.map(escape).join(', ')}</div>`:''}`}</div><div class="detail-section"><h4>Materials</h4>${materials.length?materials.slice(0,3).map(m=>`<div class="small">▤ ${escape(m.filename||m.name)}</div>`).join(''):'<span class="small muted">No materials linked yet</span>'}</div><div class="detail-section"><h4>Benchmark</h4><div class="small">Complete three coding exercises</div></div><div class="detail-section"><strong>${editable?`<input type="number" id="edit-minutes" min="1" value="${Number(t.minutes)||90}" style="width:90px;padding:7px;border:1px solid var(--border);border-radius:7px"/> min estimate`:`${t.minutes||90} min estimated`}</strong>${editable?`<div style="margin-top:10px"><button class="btn" data-action="add-topic">＋ Add session</button> <button class="btn" data-action="delete-topic" data-id="${t.id}">Remove session</button> <button class="btn" data-action="regen-topic" data-id="${t.id}">Regenerate section</button></div>`:''}</div></aside>`}
function step4(){const d=state.draft;let topic=d.topics[0];return `<div class="form"><h2>Building your course roadmap.</h2><p>Mock generation is organizing a deterministic example plan. No model is connected and file contents have not been processed.</p><div class="panel"><div style="display:flex;justify-content:space-between"><strong>${state.genFailure?'Generation paused':escape(d.genStage||'Preparing course information')}</strong><span class="small muted">${Math.min(100,d.genProgress||0)}%</span></div><div class="progress"><i style="width:${Math.min(100,d.genProgress||0)}%"></i></div><div class="small muted">${state.genFailure?'A simulated issue occurred. Your course details and materials are saved.':escape(d.genDescription||'Preparing a reviewable draft from course details.')}</div>${state.genFailure?`<div style="margin-top:14px"><button class="btn primary" data-action="retry-gen">Retry generation</button> <button class="btn" data-action="back">Back to materials</button></div>`:`<div style="margin-top:14px"><button class="btn" data-action="cancel-gen">Cancel generation</button></div>`}</div>${d.topics.length?`<h3 style="font-size:15px;margin:22px 0 10px">Roadmap preview</h3><div class="roadmap-layout">${roadmapCanvas(d.topics,d.edges,null,null,true)}${detailPanel(topic,0,d.topics,d.edges,true)}</div>`:''}${d.genWarning?`<div class="warning">${escape(d.genWarning)}<div style="margin-top:9px"><button class="btn primary" data-action="continue-draft">Continue with draft</button> <button class="btn" data-action="back">Add more context</button></div></div>`:''}</div>`}
function step5(){const d=state.draft;let t=d.topics.find(x=>x.id===state.selectedNode)||d.topics[0];let hours=(d.topics.reduce((n,x)=>n+(Number(x.minutes)||0),0)/60).toFixed(1);const warnings=(d.materials.length?0:1)+(d.groups.length?0:1);return `<div class="wizard-head"><div><h2 class="page-title">Your roadmap is ready to review.</h2><p class="muted">Check the proposed learning path before TeachFlow uses it to organize your teaching sessions.</p></div><button class="btn" data-action="back">Back to edit</button></div><div class="summary"><div class="metric"><strong>${d.topics.length}</strong><span class="small muted">Topics</span></div><div class="metric"><strong>${d.topics.length}</strong><span class="small muted">Sessions</span></div><div class="metric"><strong>${hours}</strong><span class="small muted">Teaching hours</span></div><div class="metric"><strong>${d.edges.length}</strong><span class="small muted">Prerequisites</span></div><div class="metric"><strong>${warnings}</strong><span class="small muted">Review notes</span></div></div>${warnings?`<div class="warning">${!d.materials.length?'No uploaded materials were processed; verify the proposed sequence against your source material. ':''}${!d.groups.length?'No groups are set up yet; you can add them later.':''}</div>`:''}<div class="legend"><span><i class="dot done"></i> Completed</span><span><i class="dot active"></i> In progress</span><span><i class="dot"></i> Upcoming</span><span><i class="dot attn"></i> Needs review</span></div><div class="roadmap-layout">${roadmapCanvas(d.topics,d.edges,null,null,true)}${state.showDetail?detailPanel(t,d.topics.indexOf(t),d.topics,d.edges,true):''}</div><div class="wizard-footer"><button class="btn" data-action="save-draft">Save as draft</button><button class="btn primary" data-action="approve">Approve roadmap</button></div>`}
function wizard(){return `<section><div class="wizard-head"><div><div class="eyebrow">Course setup · Step ${state.step} of 5</div><h1 class="page-title">Create a course</h1><div class="small muted">Your progress is saved in this browser as you go.</div></div><button class="btn" data-action="close-wizard">Save and close</button></div>${stepper()}${state.step===1?step1():state.step===2?step2():state.step===3?step3():state.step===4?step4():step5()}${state.step<4?`<div class="wizard-footer"><button class="btn" data-action="${state.step===1?'close-wizard':'back'}">${state.step===1?'Cancel':'Back'}</button><button class="btn primary" data-action="continue">${state.step===1?'Continue to groups':state.step===2?'Continue to materials':'Generate roadmap'} →</button></div>`:''}</section>`}
function roadmapPage(){const c=selectedCourse();if(!c)return empty();const g=group();const selected=c.topics.find(t=>t.id===state.selectedNode);const done=(c.progress?.[g?.id]||[]).length;return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:15px"><div><div class="eyebrow">Course roadmap${g?` · ${escape(g.name)}`:''}</div><h1 class="page-title">${escape(c.name)}</h1><div class="muted">${escape(c.description||'A connected learning path for this course.')}</div></div><button class="btn" data-action="new-course">＋ New course</button></div><div class="summary"><div class="metric"><strong>${done}/${c.topics.length}</strong><span class="small muted">Group sessions complete</span></div><div class="metric"><strong>${Math.round(done/Math.max(c.topics.length,1)*100)}%</strong><span class="small muted">Group progress</span></div></div><div class="legend"><span><i class="dot done"></i> Completed</span><span><i class="dot active"></i> In progress</span><span><i class="dot"></i> Upcoming</span><span><i class="dot attn"></i> Needs attention</span><span class="muted small">Progress is specific to the selected group.</span></div><div class="roadmap-layout">${roadmapCanvas(c.topics,c.edges,c,g)}${state.showDetail?detailPanel(selected,c.topics.indexOf(selected),c.topics,c.edges,false,c):''}</div>`}
function dashboard(){if(!state.courses.length&&!state.draft)return empty();let c=selectedCourse();if(!c)return `<div><div class="eyebrow">Instructor dashboard</div><h1 class="page-title">Welcome back.</h1>${state.draft?`<div class="panel"><div class="eyebrow">Saved draft</div><h2>${escape(state.draft.name||'Untitled course')}</h2><p class="muted">Continue setting up your course and roadmap.</p><button class="btn primary" data-action="resume-draft">Resume draft →</button></div>`:''}<div style="margin-top:18px">${empty()}</div></div>`;return `<div><div class="eyebrow">Instructor dashboard</div><h1 class="page-title">Welcome back.</h1><p class="muted">Your courses, roadmaps, and group progress at a glance.</p>${state.draft?`<div class="panel" style="margin-top:15px"><span class="eyebrow">Saved draft · ${escape(state.draft.name||'Untitled course')}</span> <button class="btn" data-action="resume-draft">Resume setup</button></div>`:''}<div class="panel" style="margin-top:22px"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center"><div><div class="eyebrow">Selected course</div><h2 style="margin:6px 0;font-size:20px">${escape(c.name)}</h2><div class="muted small">${escape(c.description||'')}</div></div><button class="btn primary" data-action="roadmap">Open roadmap →</button></div><div class="summary">${c.groups.map(g=>`<div class="metric"><strong>${(c.progress?.[g.id]||[]).length}/${c.topics.length}</strong><span class="small muted">${escape(g.name)} · ${escape(g.schedule||'Schedule not set')}</span></div>`).join('')}</div></div><h2 style="font-weight:580;font-size:18px;margin:26px 0 12px">Your courses</h2><div class="groups">${state.courses.map(x=>`<div class="group"><div class="eyebrow">${escape(x.status)}</div><h3>${escape(x.name)}</h3><div class="small muted">${x.topics?.length||0} sessions · ${x.groups?.length||0} groups</div><button class="btn" style="margin-top:12px" data-action="open-course" data-id="${x.id}">Open course</button></div>` function render(){const app=document.getElementById('app');app.innerHTML=`<div class="app">${sidebar()}<main class="main">${topbar()}<div class="content">${state.screen==='wizard'?wizard():state.screen==='roadmap'?roadmapPage():dashboard()}</div></main></div>${state.toast?`<div class="toast" role="status">${escape(state.toast)}</div>`:''}`;bindInputs()}
function setField(idVal,key){let el=document.getElementById(idVal);if(el)state.draft[key]=el.value}
function bindInputs(){document.querySelectorAll('[data-gfield]').forEach(el=>el.addEventListener('input',()=>{let card=el.closest('[data-group]'),g=state.draft.groups.find(x=>x.id===card.dataset.group);if(g){g[el.dataset.gfield]=el.value;persist()}}));const file=document.getElementById('file-input');if(file)file.addEventListener('change',()=>addFiles(file.files));const scroll=document.getElementById('roadmap-scroll');if(scroll){let dragging=false,sx,sy,left,top;scroll.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;dragging=true;sx=e.clientX;sy=e.clientY;left=scroll.scrollLeft;top=scroll.scrollTop;scroll.setPointerCapture(e.pointerId)});scroll.addEventListener('pointermove',e=>{if(dragging){scroll.scrollLeft=left-(e.clientX-sx);scroll.scrollTop=top-(e.clientY-sy)}});scroll.addEventListener('pointerup',()=>dragging=false)} }
function addFiles(list){const accepted=['pdf','docx','pptx','txt','md','py','ipynb'];for(const f of list){const ext=f.name.split('.').pop().toLowerCase();if(!accepted.includes(ext)){notify(`${f.name}: unsupported file type`);continue}if(f.size>25*1024*1024){notify(`${f.name}: files must be 25 MB or smaller`);continue}if(state.draft.materials.some(x=>x.filename===f.name)){continue}state.draft.materials.push({id:id(),filename:f.name,mimeType:f.type||ext,sizeBytes:f.size,status:'Selected · content extraction unavailable',ext});}persist();render()}
function saveStepFields(){if(state.step===1){state.draft.name=document.getElementById('name')?.value.trim()||'';state.draft.description=document.getElementById('desc')?.value.trim()||'';state.draft.learnerLevel=document.getElementById('level')?.value||'';state.draft.duration=document.getElementById('duration')?.value||'';state.draft.learningGoals=document.getElementById('goals')?.value||''}}
function continueWizard(){saveStepFields();if(state.step===1&&!state.draft.name){notify('Enter a course name to continue.');document.getElementById('name')?.focus();return}if(state.step===3){state.step=4;state.draft.step=4;persist();startGeneration();return}state.step++;state.draft.step=state.step;persist();render()}
function startGeneration(){const d=state.draft;state.genFailure=false;d.genProgress=0;d.genStage='Preparing course information';d.genDescription='Using course details and group setup to prepare a draft.';if(!d.topics.length){d.topics=topicsDefault();d.edges=defaultEdges(d.topics)}const stages=[['Preparing course information','Using your course description, goals, and group setup.'],['Processing materials','File content extraction is unavailable; selected files are listed as context only.'],['Identifying topics and learning goals','Organizing a deterministic example set of learning units.'],['Mapping prerequisite relationships','Checking the proposed graph for dependency cycles.'],['Proposing sessions and estimating durations','Preparing a reviewable sequence with editable estimates.'],['Validating the roadmap','Checking topic links and review warnings.'],['Preparing the review screen','Your draft is ready for instructor review.']];let n=0;render();state.generationTimer=setInterval(()=>{if(!state.draft||state.screen!=='wizard'||state.step!==4){clearInterval(state.generationTimer);return}n++;const j=Math.min(n,stages.length-1);d.genStage=stages[j][0];d.genDescription=stages[j][1];d.genProgress=Math.round((j+1)/stages.length*100);if(n>=stages.length){clearInterval(state.generationTimer);state.genFailure=false;d.status='review';d.genWarning=(!d.materials.length?'No course materials were selected. ':'')+(!d.groups.length?'No groups are configured yet; they can be added after approval.':'');state.step=5;d.step=5;state.selectedNode=d.topics[0]?.id;state.showDetail=true;persist()}render()},650)}
function acyclic(edges){const adj={};edges.forEach(([a,b])=>(adj[a]??=[]).push(b));const visiting=new Set(),done=new Set();function visit(x){if(visiting.has(x))return false;if(done.has(x))return true;visiting.add(x);for(const y of adj[x]||[])if(!visit(y))return false;visiting.delete(x);done.add(x);return true}return Object.keys(adj).every(visit)}
function reviewEdit(action){const d=state.draft,t=d.topics.find(x=>x.id===state.selectedNode);if(action==='edit'){if(!t)return;const title=document.getElementById('edit-title');if(title)t.title=title.value.trim()||t.title;const desc=document.getElementById('edit-desc');if(desc)t.description=desc.value;const obj=document.getElementById('edit-objectives');if(obj)t.objectives=obj.value.split('\n').map(x=>x.trim()).filter(Boolean);const min=document.getElementById('edit-minutes');if(min)t.minutes=Math.max(1,Number(min.value)||90);const checks=[...document.querySelectorAll('[data-prereq]')];if(checks.length){const old=d.edges.filter(e=>e[1]!==t.id);const next=[...old,...checks.filter(x=>x.checked).map(x=>[x.dataset.prereq,t.id])];if(!acyclic(next)){notify('That prerequisite would create a cycle. The previous relationships are kept.')}else d.edges=next}persist()}}
function approve(draftOnly=false){const d=state.draft;if(!d.name.trim()){notify('Course name is required.');return}let course=state.courses.find(x=>x.id===d.id);if(!course){course={id:d.id,ownerId:'instructor',createdAt:d.createdAt};state.courses.push(course)}Object.assign(course,{name:d.name,description:d.description,learnerLevel:d.learnerLevel,learningGoals:d.learningGoals.split(/[\n,]/).map(x=>x.trim()).filter(Boolean),status:draftOnly?'draft':'active',groups:d.groups.map(g=>({...g,id:g.id||id(),courseId:d.id,status:'active'})),materials:d.materials.map(m=>({...m,courseId:d.id})),topics:d.topics.map((t,i)=>({...t,courseId:d.id,sequenceIndex:i+1,status:'planned'})),edges:d.edges.map(([a,b])=>({id:id(),courseId:d.id,sourceTopicId:a,targetTopicId:b,relationshipType:'prerequisite'})),version:1,approvedAt:draftOnly?null:new Date().toISOString(),updatedAt:new Date().toISOString(),progress:course.progress||{}});if(!draftOnly&&course.groups.length&&!course.progress[course.groups[0].id])course.progress[course.groups[0].id]=course.topics.slice(0,2).map(t=>t.id);if(!draftOnly&&course.groups.length>1&&!course.progress[course.groups[1].id])course.progress[course.groups[1].id]=course.topics.slice(0,1).map(t=>t.id);state.selectedCourse=course.id;state.selectedGroup=course.groups[0]?.id||null;if(draftOnly){d.status='draft';d.step=5;persist()}else{state.draft=null;persist()}state.screen=draftOnly?'dashboard':'roadmap';state.showDetail=!draftOnly;state.selectedNode=course.topics[0]?.id||null;render();notify(draftOnly?'Draft saved. You can resume course setup later.':'Roadmap approved. Your course is ready.')}
function extractSchedule(){let s=document.getElementById('scheduleText')?.value||'';state.groupText=s;let m=s.match(/(\d+)\s+groups?/i);let count=m?Math.min(6,Number(m[1])):1;let days=[...s.matchAll(/\b(Saturday|Sunday|Monday|Tuesday|Wednesday|Thursday|Friday)\b/gi)].map(x=>x[0]);let duration=s.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)/i);let mins=duration?Math.round(Number(duration[1])*60):null;let name=(s.match(/teach(?:ing)?\s+([\w+#-]+)/i)||[])[1]||state.draft.name||'Course';state.extractPreview=Array.from({length:count},(_,i)=>({id:id(),name:`${name} · ${i<2&&days[0]?days[0]:days[1]||days[0]||'Group'}${count>1?` ${i+1}`:''}`,schedule:days[i%Math.max(days.length,1)]?`${days[i%Math.max(days.length,1)]}${duration?` · ${duration[1]}h`:''}`:'',duration:mins||''}));render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){case'create':case'new-course':createDraft();break;case'dashboard':state.screen='dashboard';render();break;case'courses':state.screen='dashboard';render();break;case'roadmap':if(!selectedCourse()){notify('Create or select a course to open its roadmap.');return}state.screen='roadmap';render();break;case'groups':case'materials':case'approvals':notify('This section is not part of the current prototype.');break;case'how':document.body.insertAdjacentHTML('beforeend',`<div class="overlay" data-modal="how"><div class="modal"><h2>How TeachFlow works</h2><p class="muted">Add a course and the materials you already use. TeachFlow proposes connected topics and sessions. You review and edit the roadmap before approving it. Each group then tracks its own progress.</p><button class="btn primary" data-action="close-modal">Got it</button></div></div>`);break;case'close-modal':document.querySelector('[data-modal]')?.remove();break;case'close-wizard':saveStepFields();persist();state.screen='dashboard';render();break;case'continue':continueWizard();break;case'back':if(state.step===5){state.step=3;state.draft.step=3}else if(state.step>1){state.step--;state.draft.step=state.step}persist();render();break;case'add-group':saveStepFields();state.draft.groups.push({id:id(),name:`Group ${state.draft.groups.length+1}`,schedule:'',duration:'',startDate:''});persist();render();break;case'remove-group':state.draft.groups=state.draft.groups.filter(g=>g.id!==b.dataset.id);persist();render();break;case'extract':extractSchedule();break;case'accept-extract':state.draft.groups.push(...(state.extractPreview||[]));state.extractPreview=null;persist();render();break;case'clear-extract':state.extractPreview=null;render();break;case'remove-file':state.draft.materials.splice(Number(b.dataset.index),1);persist();render();break;case'cancel-gen':clearInterval(state.generationTimer);state.step=3;state.draft.step=3;persist();render();notify('Generation cancelled. Your course draft is preserved.');break;case'retry-gen':startGeneration();break;case'continue-draft':state.genFailure=false;state.step=5;state.draft.step=5;state.draft.status='review';state.selectedNode=state.draft.topics[0]?.id;state.showDetail=true;persist();render();break;case'select-node':reviewEdit('edit');state.selectedNode=b.dataset.id;state.showDetail=true;render();break;case'save-draft':reviewEdit('edit');approve(true);break;case'approve':reviewEdit('edit');approve(false);break;case'open-course':state.selectedCourse=b.dataset.id;state.selectedGroup=selectedCourse()?.groups[0]?.id||null;state.screen='roadmap';state.selectedNode=selectedCourse()?.topics[0]?.id;state.showDetail=false;persist();render();break;case'zoom-in':zoom(1.15);break;case'zoom-out':zoom(.87);break;case'fit':zoom(1,true);break;case'add-topic':{reviewEdit('edit');const t={id:id(),title:'New session',description:'',objectives:[],minutes:90};state.draft.topics.push(t);state.selectedNode=t.id;persist();render();break}case'delete-topic':{const deps=state.draft.edges.filter(x=>x[0]===b.dataset.id||x[1]===b.dataset.id);if(deps.length&&!confirm('This session has prerequisite relationships. Delete it and remove those relationships?'))return;state.draft.topics=state.draft.topics.filter(x=>x.id!==b.dataset.id);state.draft.edges=state.draft.edges.filter(x=>x[0]!==b.dataset.id&&x[1]!==b.dataset.id);state.selectedNode=state.draft.topics[0]?.id;persist();render();break}case'regen-topic':notify('Mock section regenerated. Review the updated session details.');break}}
);
document.addEventListener('change',e=>{if(e.target.id==='course-select'){state.selectedCourse=e.target.value;const c=selectedCourse();state.selectedGroup=c?.groups[0]?.id||null;state.selectedNode=c?.topics[0]?.id||null;state.showDetail=false;persist();render()}if(e.target.id==='group-select'){state.selectedGroup=e.target.value;state.selectedNode=null;persist();render()}});
document.addEventListener('input',e=>{if(e.target.id==='edit-title'||e.target.id==='edit-desc'||e.target.id==='edit-objectives'||e.target.id==='edit-minutes'){/* edits are committed before navigation or approval */}});
function zoom(factor=1,fit=false){let el=document.getElementById('roadmap-inner'),wrap=document.getElementById('roadmap-scroll');if(!el||!wrap)return;let z=Number(el.dataset.zoom||1);if(fit){z=Math.min(1,(wrap.clientWidth-28)/900);wrap.scrollTo({left:0,top:0,behavior:'smooth'})}else{z=Math.max(.55,Math.min(1.5,z*factor))}el.dataset.zoom=z;el.style.transform=`scale(${z})`;el.parentElement.style.width=`${900*z}px`;el.parentElement.style.height=`${540*z}px`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='resume-draft'){openDraft()}if(b.dataset.action==='sample'){state.courses=[JSON.parse(JSON.stringify(demo))];state.selectedCourse=demo.id;state.selectedGroup=demo.groups[0].id;state.screen='roadmap';state.showDetail=true;state.selectedNode=demo.topics[2].id;persist();render()}});
render();
})();
</script>
