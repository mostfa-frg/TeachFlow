/* Reference-aligned roadmap workspace */
.app{grid-template-columns:156px minmax(0,1fr)}
.sidebar{padding:20px 12px;background:#f7f7f3}
.brand{font-size:17px;padding:0 7px 24px}
.brandmark{width:28px;height:28px;border-radius:9px}
.nav{gap:7px}
.nav button{min-height:38px;padding:9px 10px;gap:10px;border-radius:8px;color:#626b67;font-size:13px}
.nav button.active{background:#e4ebe5;color:#34483d;font-weight:600}
.nav .ico{font-size:16px}
.nav-count{margin-left:auto;min-width:18px;height:18px;border-radius:99px;background:#e5e9e3;color:#52685a;display:grid;place-items:center;font-size:10px;font-weight:650}
.topbar{height:54px;padding:0 20px;background:#fbfaf7;border-bottom-color:#ebe9e1}
.select{border-color:transparent;background:transparent;border-radius:999px;padding:7px 12px;max-width:220px;font-size:12px}
.select:hover{background:#f1f1ec}
.top-progress{display:flex;align-items:center;gap:11px;min-width:178px}
.top-progress-copy{white-space:nowrap;color:var(--sub);font-size:10px}
.top-progress-copy strong{color:var(--text);font-size:11px;font-weight:650}
.top-progress-track{width:92px;height:5px;border-radius:99px;background:#e4e3dc;overflow:hidden}
.top-progress-track i{display:block;height:100%;border-radius:99px;background:var(--sage)}
.profile{width:30px;height:30px;background:#ecebe5;color:#505b56;font-size:11px}
.content:has(.reference-roadmap){max-width:none;margin:0;padding:12px 16px 14px}
.reference-roadmap{height:calc(100vh - 80px);min-height:460px;padding-right:278px;display:flex;flex-direction:column;overflow:hidden}
.roadmap-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;min-height:76px;padding:2px 0 10px}
.roadmap-header .eyebrow{font-size:9px;letter-spacing:.12em}
.roadmap-header h1{font-size:25px;line-height:1.2;letter-spacing:-.035em;margin:5px 0 4px;font-weight:650}
.roadmap-header p{margin:0;color:var(--sub);font-size:12px}
.roadmap-header-actions{flex:none;padding-top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:11px}.roadmap-action-row{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:7px}
.roadmap-header-actions .btn{padding:8px 12px;font-size:11px;border-radius:8px}
.reference-roadmap>.warning{margin:0 0 8px;padding:7px 10px;font-size:11px}
.roadmap-tabs{display:flex;align-self:flex-start;gap:2px;padding:3px;margin:4px 0 8px;border:1px solid #e6e4dc;border-radius:9px;background:#f1f0ea}
.roadmap-tab{min-width:56px;padding:6px 10px;border:0;border-radius:7px;background:transparent;color:var(--sub);font-size:10px}
.roadmap-tab.active{background:#fffefa;color:var(--text);font-weight:600;box-shadow:0 1px 3px #252b2a12}
.roadmap-context{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px;margin-bottom:8px}
.roadmap-legend{display:flex;align-items:center;gap:13px;flex-wrap:wrap;color:#69716c;font-size:10px}
.roadmap-legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.roadmap-legend .dot{width:7px;height:7px}
.roadmap-context>.small{font-size:10px;white-space:nowrap}
.roadmap-layout.roadmap-stage{display:block;position:relative;flex:1;min-height:0;margin:0}
.roadmap-stage .roadmap-card{height:100%;min-height:0;border:0;border-radius:0;background-color:#faf9f4;background-image:radial-gradient(circle at 1px 1px,#e6e5dc 1px,transparent 1.4px);background-size:20px 20px;overflow:hidden}
.roadmap-card:before,.roadmap-card:after{content:"";position:absolute;z-index:0;pointer-events:none;border-radius:50%;background:#e9eee8;opacity:.48}
.roadmap-card:before{width:190px;height:150px;left:-105px;bottom:25px;transform:rotate(35deg)}
.roadmap-card:after{width:180px;height:155px;right:-105px;top:-55px;background:#edf0e9}
.roadmap-tools{right:12px;top:12px;gap:5px}
.roadmap-stage .iconbtn{width:29px;height:29px;border-radius:7px;background:#fffefa;font-size:14px;box-shadow:0 2px 6px #252b2a0b}
.roadmap-scroll{position:relative;z-index:1;width:100%;height:100%;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#c9cdc5 transparent}
.roadmap-inner{width:660px;height:460px;padding:0;transform-origin:top left}
.roadmap-inner svg{overflow:visible}
.edge{stroke:#758c7e;stroke-width:2.3;stroke-linecap:round}.dependency-edge{stroke:#879b90;stroke-width:1.4;stroke-dasharray:5 7;opacity:.55}
.node{z-index:1;display:grid;grid-template-columns:27px minmax(0,1fr);grid-template-rows:auto auto auto;align-content:center;gap:0 8px;width:168px;min-height:56px;border:0;border-radius:12px;background:transparent;padding:3px 5px;box-shadow:none;white-space:normal}
.node:hover{transform:translate(-50%,-50%) scale(1.035);background:#fffefa99;box-shadow:none}
.node.selected{outline:0;background:#fffefa99}
.node .nmeta{display:contents}
.node .nmeta>span:first-child{grid-column:1;grid-row:1 / span 3;align-self:center;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#a6aaa6;color:#fff;font-size:9px;font-weight:700;box-shadow:0 0 0 4px #a6aaa61b}
.node .nmeta>span:last-child{grid-column:2;grid-row:1;justify-self:start;color:#7d837e;font-size:9px;line-height:1.3;white-space:nowrap;margin-bottom:1px}
.node strong{grid-column:2;grid-row:2;align-self:center;font-size:11px;line-height:1.25;font-weight:620;color:#303735}
.node>.small{grid-column:2;grid-row:3;font-size:9px;line-height:1.3;color:#818782}
.node.done .nmeta>span:first-child{background:var(--sage);box-shadow:0 0 0 4px #708a7b20}
.node.active .nmeta>span:first-child{background:var(--blue);box-shadow:0 0 0 5px #789bb82c}
.node.active .nmeta>span:last-child{color:#597c98}
.node.attention .nmeta>span:first-child{background:var(--terra);box-shadow:0 0 0 4px #ba745720}
.node.optional .nmeta>span:first-child{background:var(--lav);box-shadow:0 0 0 4px #9690b720}
.roadmap-endpoint{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid #e2e2d9;border-radius:99px;background:#f4f3ed;color:#5e655f;font-size:10px;white-space:nowrap}
.roadmap-endpoint b{font-size:11px;color:#626c65}
.roadmap-start{left:5px;top:48px}
.roadmap-end{right:6px;bottom:6px}
@keyframes detail-slide-in{from{transform:translateX(18px);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes detail-slide-out{from{transform:translateX(0);opacity:1;visibility:visible}to{transform:translateX(calc(100% + 12px));opacity:0;visibility:hidden}}
.reference-detail{position:fixed;z-index:6;top:54px;right:0;bottom:0;width:268px;height:auto;overflow:auto;border-left:1px solid #e9e7df;border-radius:0;background:#fbfaf7;padding:18px 17px 22px;box-shadow:-8px 0 24px #252b2a08;animation:detail-slide-in .25s cubic-bezier(.2,.8,.2,1);will-change:transform}

<script>
(()=>{'use strict';
const KEY='teachflow.prototype.v1';
const API='/api/v1';
function coursePayload(d){return{name:d.name,description:d.description||null,learner_level:d.learnerLevel?d.learnerLevel.toLowerCase().split('/')[0].trim():null,learning_goals:d.learningGoals.split(/[\n,]/).map(x=>x.trim()).filter(Boolean)}}
async function ensureCourse(d){const exists=Boolean(d.apiCourseId),r=await apiRequest(exists?`/courses/${d.apiCourseId}`:'/courses',{method:exists?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(coursePayload(d))});d.apiCourseId=r.id;persist()}
async function syncGroups(d){const current=await apiRequest(`/courses/${d.apiCourseId}/groups`);for(const g of d.groups){const old=current.find(x=>x.id===g.apiGroupId)||current.find(x=>x.name===g.name),payload={name:g.name,weekday:g.weekday||null,start_time:g.startTime||null,start_date:g.startDate||null,schedule_description:g.schedule||null,session_duration_minutes:g.duration?Number(g.duration):null};const r=await apiRequest(old?`/courses/${d.apiCourseId}/groups/${old.id}`:`/courses/${d.apiCourseId}/groups`,{method:old?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});g.apiGroupId=r.id}persist()}
async function removeMaterial(i){try{const m=state.draft.materials[i];if(m.apiId)await apiRequest(`/courses/${state.draft.apiCourseId}/materials/${m.apiId}`,{method:'DELETE'});state.draft.materials.splice(i,1);persist();render()}catch(e){notify(`Could not remove material: ${e.message}`)}}
const demo={id:'py-course',ownerId:'instructor',name:'Python Development',description:'A practical path from Python foundations to APIs, databases, and applied AI.',learnerLevel:'Beginner',learningGoals:['Build Python applications','Understand APIs and databases','Create a small RAG project'],status:'active',groups:[{id:'g-sat',name:'Saturday Group',schedule:'Saturday · 10:00',startDate:'2026-09-05',status:'active'},{id:'g-mon',name:'Monday Evening',schedule:'Monday · 18:30',startDate:'2026-09-07',status:'active'}],materials:[{id:'m1',filename:'Python_Foundations.pdf',mimeType:'application/pdf',sizeBytes:2048000,status:'processed'},{id:'m2',filename:'API_Workshop.pptx',mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation',sizeBytes:4300800,status:'processed'}],topics:[{id:'t1',title:'Python Basics',minutes:120},{id:'t2',title:'Control Flow',minutes:90},{id:'t3',title:'Functions',minutes:120},{id:'t4',title:'OOP Concepts',minutes:120},{id:'t5',title:'Classes & Inheritance',minutes:120},{id:'t6',title:'Git Essentials',minutes:90},{id:'t7',title:'Working with APIs',minutes:120},{id:'t8',title:'FastAPI',minutes:150},{id:'t9',title:'Databases',minutes:150},{id:'t10',title:'Final RAG Project',minutes:180}],edges:[['t1','t2'],['t2','t3'],['t3','t4'],['t4','t5'],['t3','t6'],['t3','t7'],['t7','t8'],['t8','t9'],['t9','t10'],['t8','t10']],progress:{'g-sat':['t1','t2','t3','t4'],'g-mon':['t1','t2']},attention:'t9',version:1};
const defaultState=()=>({courses:[],draft:null,screen:'dashboard',selectedCourse:null,selectedGroup:null,selectedNode:null,selectedNodeManually:false,showDetail:false,toast:'',groupText:'',extractPreview:null,genFailure:false,step:1,apiLoadStatus:'loading',apiError:'',demoMode:false,pendingGoalUpdates:{}});
let state={...defaultState(),...(safeLoad()||{})};let toastTimer;const TOAST_DURATION=3600;let toastDeadline=0;state.toast='';
function safeLoad(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(!v||v.version!==1)return null;const draft=v.draft||null;if(draft){draft.materials=(draft.materials||[]).map(m=>m.apiId?m:{...m,status:'Needs upload',errorMessage:'Selected in an older browser-only draft; select this file again to upload.'});if(!draft.apiRoadmapId&&(draft.step>=4||draft.status==='review')){draft.step=3;draft.status='draft';draft.topics=[];draft.edges=[];draft.genWarning='An earlier prototype roadmap was simulated and was not saved. Generate a real proposal for review.'}}return{courses:(v.courses||[]).filter(c=>c.apiCourseId&&!c.localOnly),draft,selectedCourse:v.selectedCourse||null,selectedGroup:v.selectedGroup||null}}catch{return null}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:1,courses:state.courses.filter(c=>c.apiCourseId&&!c.localOnly),draft:state.draft,selectedCourse:state.selectedCourse,selectedGroup:state.selectedGroup}))}catch{}}
function escape(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Math.random().toString(36).slice(2,10)}
function selectedCourse(){return state.courses.find(c=>c.id===state.selectedCourse)||null}
function group(){const c=selectedCourse();return c?.groups.find(g=>g.id===state.selectedGroup)||c?.groups[0]||null}
function notify(msg){clearTimeout(toastTimer);state.toast=String(msg);toastDeadline=Date.now()+TOAST_DURATION;document.querySelector('.toast')?.remove();const box=document.createElement('div');box.className='toast';box.setAttribute('role','status');box.innerHTML='<span class="toast-progress" aria-hidden="true"><i style="--toast-from:1;--toast-remaining:3600ms"></i></span>';box.append(document.createTextNode(state.toast));document.body.append(box);toastTimer=setTimeout(()=>{state.toast='';toastDeadline=0;document.querySelectorAll('.toast').forEach(t=>t.remove())},TOAST_DURATION)}

function groupCard(g,i){return `<div class="group" data-group="${escape(g.id)}"><div class="group-top"><strong>Group ${i+1}</strong><button class="remove" data-action="remove-group" data-id="${escape(g.id)}" aria-label="Remove group">Remove</button></div><input data-gfield="name" value="${escape(g.name)}" placeholder="Group name" aria-label="Group name"/>${timeFields(g,escape)}<input data-gfield="schedule" value="${escape(g.schedule)}" placeholder="Days and start time · optional" aria-label="Meeting schedule"/><div class="row"><input data-gfield="duration" type="number" min="1" value="${escape(g.duration||'')}" placeholder="Minutes" aria-label="Session duration in minutes"/><input data-gfield="startDate" type="date" value="${escape(g.startDate||'')}" aria-label="Course start date"/></div></div>`}
function step2(){return `<div class="panel form"><h2>How do you teach this course?</h2><p>Set up your teaching groups. They can follow the same roadmap at different speeds and on different schedules.</p><div class="field"><label for="scheduleText">Describe your schedule <span>Optional</span></label><textarea id="scheduleText" placeholder="Example: I teach Python to four groups. Two meet on Saturday, and two meet on Monday. Each session lasts two hours.">${escape(state.groupText)}</textarea><button class="btn" data-action="extract" style="justify-self:start">Preview suggested groups</button></div>${state.extractPreview?`<div class="warning">Schedule preview from your description — verify every group and duration before adding it.<div style="margin-top:9px"><button class="btn" data-action="accept-extract">Add suggested groups</button> <button class="btn" data-action="clear-extract">Dismiss</button></div></div>`:''}<div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px"><strong>Groups <span class="muted small">(${state.draft.groups.length})</span></strong><button class="btn" data-action="add-group">＋ Add group</button></div><div class="groups">${state.draft.groups.map(groupCard).join('')||`<div class="muted small">No groups yet. You can add groups later.</div>`}</div>${calendarImportPanel(state,escape,groupCard)}</div>`}
function step3(){const files=state.draft.materials;return `<div class="panel form"><h2>Bring your teaching materials.</h2><p>TeachFlow uses your existing content to build a roadmap grounded in what you actually teach.</p><label class="upload" for="file-input" style="display:block;cursor:pointer"><div style="font-size:27px;margin-bottom:5px">▤</div><strong>Drop your files here or browse files.</strong><div class="small" style="margin-top:5px">Text PDF, TXT, Markdown or source code · up to 10 MB each · text is extracted before AI analysis</div><input type="file" id="file-input" multiple accept=".pdf,.txt,.md,.py,.js,.ts,.java,.json" hidden/></label>${state.draft.genWarning?`<div class="warning">${escape(state.draft.genWarning)}</div>`:''}<div class="files">${files.map((f,i)=>`<div class="file"><div class="file-icon">${escape((f.ext||f.name.split('.').pop()).toUpperCase())}</div><div class="file-info"><strong>${escape(f.name)}</strong><span class="small muted">${formatBytes(f.size||f.sizeBytes)} · <span class="status">${escape(f.status)}</span>${(f.chunks||[]).map(c=>escape(c.locator)).join(' · ')} ${f.errorMessage?`<span class="small muted">${escape(f.errorMessage)}</span>`:''}</span></div><button data-action="remove-file" data-index="${i}" aria-label="Remove ${escape(f.name)}">×</button></div>`).join('')||'<p class="small muted">No materials selected. You can continue with your course description and learning goals.</p>'}</div><div class="small muted" style="margin-top:18px">Materials are uploaded to the configured TeachFlow server and extracted before generation. Extraction status does not mean an AI roadmap has been generated.</div></div>`}
function formatBytes(n){if(!n)return '0 B';let k=1024,u=['B','KB','MB','GB'],i=Math.floor(Math.log(n)/Math.log(k));return `${(n/Math.pow(k,i)).toFixed(i?1:0)} ${u[i]}`}
function roadmapSvg(topics,edges,positions,width,height,statuses={},selectedId=null){const sequence=topics.slice(1).map((topic,index)=>{const start=positions[topics[index].id],end=positions[topic.id],row=Math.floor(index/4),nextRow=Math.floor((index+1)/4);if(!start||!end)return '';const fromStatus=statuses[topics[index].id],toStatus=statuses[topic.id],state=fromStatus==='done'&&toStatus==='done'?'completed':(fromStatus==='done'&&toStatus==='active'?'active':'upcoming');if(row!==nextRow){const direction=row%2===0?1:-1,shoulder=165*direction,control=245*direction;return `<path class="edge roadmap-route" data-state="${state}" d="M ${start.x} ${start.y} H ${start.x+shoulder} C ${start.x+control} ${start.y}, ${end.x+control} ${end.y}, ${end.x+shoulder} ${end.y} H ${end.x}"/>`;}return `<path class="edge roadmap-route" data-state="${state}" d="M ${start.x} ${start.y} L ${end.x} ${end.y}"/>`;}).join('');const indexes=new Map(topics.map((topic,index)=>[topic.id,index]));const extraEdges=(edges||[]).filter(([from,to])=>indexes.has(from)&&indexes.has(to)&&indexes.get(to)!==indexes.get(from)+1).map(([from,to])=>{const start=positions[from],end=positions[to],dx=end.x-start.x,dy=end.y-start.y;return `<path class="edge dependency-edge" data-related="${from===selectedId||to===selectedId}" data-from="${encodeURIComponent(from)}" data-to="${encodeURIComponent(to)}" d="M ${start.x} ${start.y} C ${start.x+dx*.4} ${start.y+dy*.12}, ${end.x-dx*.4} ${end.y-dy*.12}, ${end.x} ${end.y}"/>`;}).join('');return `<svg viewBox="0 0 ${width} ${height}" aria-hidden="true">${sequence}${extraEdges}</svg>`;}
function positionsFor(topics){const columns=4,columnGap=212,rowGap=215,left=255,top=118;const rows=Math.max(1,Math.ceil(topics.length/columns));const width=left+(columns-1)*columnGap+300;const height=Math.max(460,top+(rows-1)*rowGap+164);const positions={};topics.forEach((topic,index)=>{const row=Math.floor(index/columns),offset=index%columns,column=row%2===0?offset:columns-1-offset;positions[topic.id]={x:left+column*columnGap,y:top+row*rowGap};});return {positions,width,height};}
function sessionGoals(t){return Array.isArray(t?.objectives)&&t.objectives.length?t.objectives:['Understand core ideas','Apply concepts in practice']}
function completedGoalIndexes(t,c,g){const saved=c?.goalProgress?.[g?.id]?.[t?.id];if(Array.isArray(saved))return saved;return (c?.progress?.[g?.id]||[]).includes(t?.id)?sessionGoals(t).map((_,i)=>i):[]}
function sessionGoalPercent(t,c,g){return Math.round(completedGoalIndexes(t,c,g).length/Math.max(sessionGoals(t).length,1)*100)}
function topicStatus(t,c,g){if(c?.attention===t.id)return 'attention';const n=completedGoalIndexes(t,c,g).length,total=sessionGoals(t).length;if(n>=total)return 'done';if(n)return 'active';const progress=c?.progress?.[g?.id]||[],edges=c?.edges||[];const firstAvailable=(c?.topics||[]).find(candidate=>!progress.includes(candidate.id)&&c?.attention!==candidate.id&&edges.filter(e=>hardLink(e)&&e[1]===candidate.id).every(e=>progress.includes(e[0])));return firstAvailable?.id===t.id?'active':'upcoming'}
async function hydrateApiCourse(raw){
  const groups=(raw.groups||await apiRequest(`/courses/${raw.id}/groups`)).map(g=>({id:g.id,apiGroupId:g.id,courseId:raw.id,name:g.name,schedule:g.schedule_description||'',weekday:g.weekday,startTime:g.start_time,startDate:g.start_date,duration:g.session_duration_minutes||'',status:'active'}));
  const [materials,roadmap]=await Promise.all([
    apiRequest(`/courses/${raw.id}/materials`),
    apiRequest(`/courses/${raw.id}/roadmaps/approved`).catch(error=>{if(error.status===404)return null;throw error})
  ]);
  const history=await apiRequest(`/courses/${raw.id}/history`);
  const approvals=await apiRequest(`/courses/${raw.id}/approvals`);
  const overview=Object.fromEntries(await Promise.all(groups.map(async g=>[g.id,await apiRequest(`/groups/${g.id}/overview`)])));
  const progressRows=await Promise.all(groups.map(async g=>[g.id,await apiRequest(`/groups/${g.id}/progress`)]));
  const {topics,edges}=graphFromVersion(roadmap);
  const goalProgress={},progress={};
  const sessionByApiId=new Map(topics.map(t=>[t.sessionId,t]));
  for(const [groupId,rows] of progressRows){
    goalProgress[groupId]={};progress[groupId]=[];
    for(const row of rows){
      const session=sessionByApiId.get(row.session_id);
      if(!session)continue;
      const savedIndexes=[...(row.completed_objective_indexes||[])].sort((a,b)=>a-b);
      const indexes=row.state==='completed'?sessionGoals(session).map((_,i)=>i):savedIndexes;
      goalProgress[groupId][session.id]=indexes;
      if(row.state==='completed'||(sessionGoals(session).length>0&&indexes.length>=sessionGoals(session).length))progress[groupId].push(session.id);
    }
  }
  return{history,approvals,pendingCount:approvals.length,overview,id:raw.id,apiCourseId:raw.id,name:raw.name,description:raw.description||'',learnerLevel:raw.learner_level||'',learningGoals:(raw.learning_goals||[]).join('\n'),status:roadmap?'active':'setup',groups,materials:materials.map(m=>({apiId:m.id,id:m.id,courseId:raw.id,filename:m.filename,name:m.filename,mimeType:m.media_type,sizeBytes:m.size_bytes,status:m.status,chunks:m.chunks||[],errorMessage:m.error_message})),topics,edges,progress,goalProgress,version:roadmap?.version_number||null,apiRoadmapId:roadmap?.id||null,attention:null,localOnly:false};
}
async function loadBackendCourses(){
  state.apiLoadStatus='loading';state.apiError='';
  try{
    const records=await apiRequest('/courses');
    const loaded=await Promise.all(records.map(hydrateApiCourse));
    if(state.demoMode)loaded.push(JSON.parse(JSON.stringify(demo)));
    state.courses=loaded;
    const previousCourse=state.selectedCourse;
    state.selectedCourse=loaded.some(c=>c.id===previousCourse)?previousCourse:(loaded[0]?.id||null);
    const current=selectedCourse();
    state.selectedGroup=current?.groups.some(g=>g.id===state.selectedGroup)?state.selectedGroup:(current?.groups[0]?.id||null);
    if(!current?.topics?.some(t=>t.id===state.selectedNode)){state.selectedNode=defaultRoadmapSession(current,group())?.id||null;state.selectedNodeManually=false}
    state.apiLoadStatus='ready';state.apiError='';persist();render();
  }catch(error){
    state.apiLoadStatus='error';state.apiError=error.message||'Could not load saved courses.';render();
  }
}

function defaultRoadmapSession(c,g){const topics=c?.topics||[];return topics.find(t=>topicStatus(t,c,g)==='active')||topics.find(t=>topicStatus(t,c,g)==='attention')||topics.find(t=>topicStatus(t,c,g)==='upcoming')||topics[0]||null}
function roadmapCanvas(topics,edges,c,grp,editable=false){const layout=positionsFor(topics),positions=layout.positions,width=layout.width,height=layout.height,statuses=Object.fromEntries(topics.map(t=>[t.id,editable?'upcoming':topicStatus(t,c,grp)]));return `<div class="roadmap-card"><div class="roadmap-tools"><button class="iconbtn" data-action="zoom-out" aria-label="Zoom out" title="Zoom out">−</button><button class="iconbtn" data-action="zoom-in" aria-label="Zoom in" title="Zoom in">＋</button><button class="iconbtn" data-action="fullscreen" aria-label="Full screen roadmap" title="Full screen roadmap">⛶</button></div><div class="roadmap-scroll" id="roadmap-scroll"><div class="roadmap-canvas-size" id="roadmap-canvas-size" style="width:${width}px;height:${height}px"><div class="roadmap-inner" id="roadmap-inner" style="width:${width}px;height:${height}px"><span class="roadmap-endpoint roadmap-start" style="left:${(positions[topics[0]?.id]?.x||255)-24}px;top:31px">Start</span><span class="roadmap-endpoint roadmap-end" style="left:${Math.max(12,(positions[topics[topics.length-1]?.id]?.x||width/2)-19)}px;right:auto;bottom:17px">End</span>${roadmapSvg(topics,edges,positions,width,height,statuses,state.selectedNode)}${topics.map((t,i)=>{let p=positions[t.id],s=editable?'upcoming':topicStatus(t,c,grp),pct=editable?0:sessionGoalPercent(t,c,grp),ring=s==='done'?'var(--sage)':s==='active'?'var(--blue)':'#a6aaa6';return `<button class="node ${s} ${state.selectedNode===t.id?'selected':''}" style="left:${p.x}px;top:${p.y}px;--goal-progress:${pct}%;--goal-color:${ring}" data-action="select-node" data-id="${escape(t.id)}" aria-pressed="${state.selectedNode===t.id}" title="${escape(t.title)}" aria-label="Session ${i+1}: ${escape(t.title)}, ${s}"><span class="nmeta"><span class="node-number">${String(i+1).padStart(2,'0')}</span><span>${s==='done'?'✓':s==='active'?'◉':s==='attention'?'!':s==='upcoming'?'○':'◇'} ${s==='done'?'Complete':s==='active'?'In progress':s==='attention'?'Review':s}</span></span><strong>${escape(t.title)}</strong><span class="small muted">${t.minutes||90} min</span></button>`}).join('')}</div></div></div></div>`}
function detailPanel(t,i,topics,edges,editable,c){

rrent)break;const peers=state.draft.topics.filter(x=>x.topicStableId===current.topicStableId),sequenceIndex=Math.max(...peers.map(x=>x.sequenceIndex||state.draft.roadmapProposal.sessions.find(s=>s.stable_id===x.id)?.sequence_index||1))+1,t={id:id(),topicStableId:current.topicStableId,topicTitle:current.topicTitle,sequenceIndex,title:'Session '+(state.draft.topics.length+1),description:'',objectives:['Understand the key concept','Apply it in a practical exercise'],minutes:90};state.draft.topics.push(t);state.draft.edges.push([peers[peers.length-1].id,t.id]);state.selectedNode=t.id;persist();render();break}case'delete-topic':{const target=state.draft?.topics.find(x=>x.id===b.dataset.id);if(!target)break;const sameTopic=state.draft.topics.filter(x=>x.topicStableId===target.topicStableId);if(sameTopic.length===1){notify('This is the only session in its topic. Add another session before removing it.');break}const linked=state.draft.edges.filter(x=>x[0]===target.id||x[1]===target.id).length;state.pendingDeleteTopic=target.id;document.body.insertAdjacentHTML('beforeend',`<div class="overlay" data-modal="delete-topic"><div class="modal"><h2>Remove session?</h2><p class="muted">${escape(target.title)} will be removed from the roadmap.${linked?' Its '+linked+' prerequisite relationship(s) will also be removed.':''} This cannot be undone after you save the roadmap.</p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" data-action="cancel-delete-topic">Cancel</button><button class="btn primary" data-action="confirm-delete-topic">Remove session</button></div></div></div>`);break}case'cancel-delete-topic':state.pendingDeleteTopic=null;document.querySelector('[data-modal="delete-topic"]')?.remove();break;case'confirm-delete-topic':{const target=state.pendingDeleteTopic;if(!target)break;state.draft.topics=state.draft.topics.filter(x=>x.id!==target);state.draft.edges=state.draft.edges.filter(x=>x[0]!==target&&x[1]!==target);state.selectedNode=state.draft.topics[0]?.id||null;state.pendingDeleteTopic=null;document.querySelector('[data-modal="delete-topic"]')?.remove();persist();render();break}case'regen-topic':notify('Section regeneration is not available.');break}}
);
document.addEventListener('change',e=>{if(['course-select','group-select'].includes(e.target.id)&&state.screen==='review')state.screen='roadmap';if(e.target.id==='course-select'){state.selectedCourse=e.target.value;const c=selectedCourse();state.selectedGroup=c?.groups[0]?.id||null;state.selectedNode=defaultRoadmapSession(c,group())?.id||null;state.selectedNodeManually=false;persist();render()}if(e.target.id==='group-select'){state.selectedGroup=e.target.value;state.selectedNode=defaultRoadmapSession(selectedCourse(),group())?.id||null;persist();render()}});
document.addEventListener('input',e=>{if(e.target.id==='edit-title'||e.target.id==='edit-desc'||e.target.id==='edit-objectives'||e.target.id==='edit-minutes'){/* edits are committed before navigation or approval */}});
function zoom(factor=1,fit=false){ const el=document.getElementById('roadmap-inner'),wrap=document.getElementById('roadmap-scroll'),canvas=document.getElementById('roadmap-canvas-size'); if(!el||!wrap||!canvas)return; const baseWidth=parseFloat(el.style.width)||660,baseHeight=parseFloat(el.style.height)||460; const previous=Number(el.dataset.zoom||1); const minimumReadableZoom=wrap.clientWidth<650?.78:.72; const next=fit?Math.max(minimumReadableZoom,Math.min(1.6,(wrap.clientWidth-32)/baseWidth)):Math.max(.55,Math.min(1.6,previous*factor)); const cx=(wrap.scrollLeft+wrap.clientWidth/2)/previous,cy=(wrap.scrollTop+wrap.clientHeight/2)/previous; state.roadmapZoom=next; el.dataset.zoom=String(next); el.style.transform=`scale(${next})`; canvas.style.width=`${baseWidth*next}px`; canvas.style.height=`${baseHeight*next}px`; canvas.style.marginLeft='auto';canvas.style.marginRight='auto'; if(fit)wrap.scrollTo({left:Math.max(0,(baseWidth*next-wrap.clientWidth)/2),top:0,behavior:'smooth'}); else requestAnimationFrame(()=>wrap.scrollTo({left:Math.max(0,cx*next-wrap.clientWidth/2),top:Math.max(0,cy*next-wrap.clientHeight/2),behavior:'smooth'})); }

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='resume-draft'){openDraft()}if(b.dataset.action==='sample'){state.demoMode=true;state.courses=[...state.courses.filter(c=>c.apiCourseId),JSON.parse(JSON.stringify(demo))];state.selectedCourse=demo.id;state.selectedGroup=demo.groups[0].id;state.screen='roadmap';state.showDetail=true;state.selectedNode=demo.topics[2].id;persist();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const card=document.querySelector('.roadmap-card.is-fullscreen');if(card){card.classList.remove('is-fullscreen');const button=card.querySelector('[data-action="fullscreen"]');if(button){button.textContent='⛶';button.title='Full screen roadmap';button.setAttribute('aria-label','Full screen roadmap')}}}});
render();
loadBackendCourses();
})();
</script>
