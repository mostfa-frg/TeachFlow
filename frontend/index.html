/* Reference-aligned roadmap workspace */
.app{grid-template-columns:156px minmax(0,1fr)}
.sidebar{padding:20px 12px;background:#f7f7f3}
.brand{font-size:17px;padding:0 7px 24px}
.brandmark{width:28px;height:28px;border-radius:9px}
.nav{gap:7px}
.nav button{min-height:38px;padding:9px 10px;gap:10px;border-radius:8px;color:#626b67;font-size:13px}
.nav button.active{background:#e4ebe5;color:#34483d;font-weight:600}
.nav .ico{font-size:16px}
.nav-count{margin-left:auto;min-width:18px;height:18px;border-radius:99px;background:#e5e9e3;color:#52685a;display:grid;place-items:center;font-size:10px;font-weight:650}
.topbar{height:54px;padding:0 20px;background:#fbfaf7;border-bottom-color:#ebe9e1}
.select{border-color:transparent;background:transparent;border-radius:999px;padding:7px 12px;max-width:220px;font-size:12px}
.select:hover{background:#f1f1ec}
.top-progress{display:flex;align-items:center;gap:11px;min-width:178px}
.top-progress-copy{white-space:nowrap;color:var(--sub);font-size:10px}
.top-progress-copy strong{color:var(--text);font-size:11px;font-weight:650}
.top-progress-track{width:92px;height:5px;border-radius:99px;background:#e4e3dc;overflow:hidden}
.top-progress-track i{display:block;height:100%;border-radius:99px;background:var(--sage)}
.profile{width:30px;height:30px;background:#ecebe5;color:#505b56;font-size:11px}
.content:has(.reference-roadmap){max-width:none;margin:0;padding:12px 16px 14px}
.reference-roadmap{height:calc(100vh - 80px);min-height:460px;padding-right:278px;display:flex;flex-direction:column;overflow:hidden}
.roadmap-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;min-height:76px;padding:2px 0 10px}
.roadmap-header .eyebrow{font-size:9px;letter-spacing:.12em}
.roadmap-header h1{font-size:25px;line-height:1.2;letter-spacing:-.035em;margin:5px 0 4px;font-weight:650}
.roadmap-header p{margin:0;color:var(--sub);font-size:12px}
.roadmap-header-actions{flex:none;padding-top:12px}
.roadmap-header-actions .btn{padding:8px 12px;font-size:11px;border-radius:8px}
.reference-roadmap>.warning{margin:0 0 8px;padding:7px 10px;font-size:11px}
.roadmap-tabs{display:flex;align-self:flex-start;gap:2px;padding:3px;margin:4px 0 8px;border:1px solid #e6e4dc;border-radius:9px;background:#f1f0ea}
.roadmap-tab{min-width:56px;padding:6px 10px;border:0;border-radius:7px;background:transparent;color:var(--sub);font-size:10px}
.roadmap-tab.active{background:#fffefa;color:var(--text);font-weight:600;box-shadow:0 1px 3px #252b2a12}
.roadmap-context{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px;margin-bottom:8px}
.roadmap-legend{display:flex;align-items:center;gap:13px;flex-wrap:wrap;color:#69716c;font-size:10px}
.roadmap-legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.roadmap-legend .dot{width:7px;height:7px}
.roadmap-context>.small{font-size:10px;white-space:nowrap}
.roadmap-layout.roadmap-stage{display:block;position:relative;flex:1;min-height:0;margin:0}
.roadmap-stage .roadmap-card{height:100%;min-height:0;border:0;border-radius:0;background-color:#faf9f4;background-image:radial-gradient(circle at 1px 1px,#e6e5dc 1px,transparent 1.4px);background-size:20px 20px;overflow:hidden}
.roadmap-card:before,.roadmap-card:after{content:"";position:absolute;z-index:0;pointer-events:none;border-radius:50%;background:#e9eee8;opacity:.48}
.roadmap-card:before{width:190px;height:150px;left:-105px;bottom:25px;transform:rotate(35deg)}
.roadmap-card:after{width:180px;height:155px;right:-105px;top:-55px;background:#edf0e9}
.roadmap-tools{right:12px;top:12px;gap:5px}
.roadmap-stage .iconbtn{width:29px;height:29px;border-radius:7px;background:#fffefa;font-size:14px;box-shadow:0 2px 6px #252b2a0b}
.roadmap-scroll{position:relative;z-index:1;width:100%;height:100%;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#c9cdc5 transparent}
.roadmap-inner{width:660px;height:460px;padding:0;transform-origin:top left}
.roadmap-inner svg{overflow:visible}
.edge{stroke:#c8cbc3;stroke-width:2.2}
.node{z-index:1;display:grid;grid-template-columns:27px minmax(0,1fr);grid-template-rows:auto auto auto;align-content:center;gap:0 8px;width:168px;min-height:56px;border:0;border-radius:12px;background:transparent;padding:3px 5px;box-shadow:none;white-space:normal}
.node:hover{transform:translate(-50%,-50%) scale(1.035);background:#fffefa99;box-shadow:none}
.node.selected{outline:0;background:#fffefa99}
.node .nmeta{display:contents}
.node .nmeta>span:first-child{grid-column:1;grid-row:1 / span 3;align-self:center;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#a6aaa6;color:#fff;font-size:9px;font-weight:700;box-shadow:0 0 0 4px #a6aaa61b}
.node .nmeta>span:last-child{grid-column:2;grid-row:1;justify-self:start;color:#7d837e;font-size:9px;line-height:1.3;white-space:nowrap;margin-bottom:1px}
.node strong{grid-column:2;grid-row:2;align-self:center;font-size:11px;line-height:1.25;font-weight:620;color:#303735}
.node>.small{grid-column:2;grid-row:3;font-size:9px;line-height:1.3;color:#818782}
.node.done .nmeta>span:first-child{background:var(--sage);box-shadow:0 0 0 4px #708a7b20}
.node.active .nmeta>span:first-child{background:var(--blue);box-shadow:0 0 0 5px #789bb82c}
.node.active .nmeta>span:last-child{color:#597c98}
.node.attention .nmeta>span:first-child{background:var(--terra);box-shadow:0 0 0 4px #ba745720}
.node.optional .nmeta>span:first-child{background:var(--lav);box-shadow:0 0 0 4px #9690b720}
.roadmap-endpoint{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid #e2e2d9;border-radius:99px;background:#f4f3ed;color:#5e655f;font-size:10px;white-space:nowrap}
.roadmap-endpoint b{font-size:11px;color:#626c65}
.roadmap-start{left:5px;top:48px}
.roadmap-end{right:6px;bottom:6px}
@keyframes detail-slide-in{from{transform:translateX(18px);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes detail-slide-out{from{transform:translateX(0);opacity:1;visibility:visible}to{transform:translateX(calc(100% + 12px));opacity:0;visibility:hidden}}
.reference-detail{position:fixed;z-index:6;top:54px;right:0;bottom:0;width:268px;height:auto;overflow:auto;border-left:1px solid #e9e7df;border-radius:0;background:#fbfaf7;padding:18px 17px 22px;box-shadow:-8px 0 24px #252b2a08;animation:detail-slide-in .25s cubic-bezier(.2,.8,.2,1);will-change:transform}
.reference-detail.is-closed{display:none;transform:translateX(calc(100% + 12px));opacity:0;pointer-events:none;animation:none}.session-goal-list{display:grid;gap:6px}.session-goal{display:flex;gap:9px;width:100%;text-align:left;padding:9px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}.session-goal-check{display:grid;place-items:center;width:17px;height:17px;border:1px solid #c8c9bf;border-radius:5px;color:transparent}.session-goal.is-done .session-goal-check{background:var(--sage);border-color:var(--sage);color:white}.goal-progress-row{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--sub)}.goal-progress-track{height:4px;background:#e8e7df;border-radius:9px;overflow:hidden;margin-top:6px}.goal-progress-track i{display:block;height:100%;background:var(--sage);transition:width .2s ease}.node .node-number{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--goal-color) var(--goal-progress),#e6e5dd 0);position:relative;color:var(--ink);isolation:isolate}.node .node-number:before{content:'';position:absolute;inset:3px;background:var(--surface);border-radius:50%;z-index:-1}.reference-detail h3{font-size:19px;line-height:1.25;margin:3px 0 8px;font-weight:650}
.reference-detail .detail-section{padding:12px 0;border-color:#eeece5}
.reference-detail .detail-section h4{font-size:10px;letter-spacing:.08em;margin-bottom:7px}
.reference-detail .detail-section>div,.reference-detail .detail-section li{font-size:11px;line-height:1.5}

<body>
<div id="app"></div>
<script>
(()=>{'use strict';
const KEY='teachflow.prototype.v1';
const API='/api/v1';
async function apiRequest(path,options={}){const r=await fetch(`${API}${path}`,options);if(r.status===204)return null;const d=await r.json().catch(()=>null);if(!r.ok){const error=new Error(d?.error?.message||`Request failed (${r.status})`);error.status=r.status;throw error}return d}
function coursePayload(d){return{name:d.name,description:d.description||null,learner_level:d.learnerLevel?d.learnerLevel.toLowerCase().split('/')[0].trim():null,learning_goals:d.learningGoals.split(/[\n,]/).map(x=>x.trim()).filter(Boolean)}}
async function ensureCourse(d){const exists=Boolean(d.apiCourseId),r=await apiRequest(exists?`/courses/${d.apiCourseId}`:'/courses',{method:exists?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(coursePayload(d))});d.apiCourseId=r.id;persist()}
async function syncGroups(d){const current=await apiRequest(`/courses/${d.apiCourseId}/groups`);for(const g of d.groups){const old=current.find(x=>x.id===g.apiGroupId)||current.find(x=>x.name===g.name),payload={name:g.name,schedule_description:g.schedule||null,session_duration_minutes:g.duration?Number(g.duration):null};const r=await apiRequest(old?`/courses/${d.apiCourseId}/groups/${old.id}`:`/courses/${d.apiCourseId}/groups`,{method:old?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});g.apiGroupId=r.id}persist()}
function proposalForSave(d){const o=d.roadmapProposal,byId=new Map(d.topics.map(x=>[x.id,x])),topicByStableId=new Map(o.topics.map(t=>[t.stable_id,t]));const topics=o.topics.filter(t=>d.topics.some(x=>x.topicStableId===t.stable_id)).map(t=>{const x=d.topics.find(y=>y.topicStableId===t.stable_id);return{id:t.stable_id,title:t.title,description:t.description,learning_objectives:t.learning_objectives,support_note:t.support_note}});for(const x of d.topics.filter(y=>y.isNewTopic))topics.push({id:x.topicStableId,title:x.topicTitle||x.title,description:x.description||x.title,learning_objectives:x.objectives?.length?x.objectives:[x.title],support_note:'Added by instructor during review.'});const sessions=d.topics.map(x=>{const old=o.sessions.find(y=>y.stable_id===x.id);return{id:x.id,topic_id:x.topicStableId,sequence_index:old?.sequence_index||x.sequenceIndex||1,title:x.title,description:x.description||x.title,duration_minutes:Number(x.minutes)||90,learning_objectives:x.objectives?.length?x.objectives:(topicByStableId.get(x.topicStableId)?.learning_objectives||[x.title]),supporting_material_ids:old?.supporting_material_ids||[]}});const deps=new Map();for(const [a,b] of d.edges){const from=byId.get(a),to=byId.get(b);if(from&&to&&from.topicStableId!==to.topicStableId)deps.set(`${from.topicStableId}:${to.topicStableId}`,{prerequisite_topic_id:from.topicStableId,dependent_topic_id:to.topicStableId})}return{topics,sessions,dependencies:[...deps.values()],warnings:o.warnings||[]}}
async function removeMaterial(i){try{const m=state.draft.materials[i];if(m.apiId)await apiRequest(`/courses/${state.draft.apiCourseId}/materials/${m.apiId}`,{method:'DELETE'});state.draft.materials.splice(i,1);persist();render()}catch(e){notify(`Could not remove material: ${e.message}`)}}
const demo={id:'py-course',ownerId:'instructor',name:'Python Development',description:'A practical path from Python foundations to APIs, databases, and applied AI.',learnerLevel:'Beginner',learningGoals:['Build Python applications','Understand APIs and databases','Create a small RAG project'],status:'active',groups:[{id:'g-sat',name:'Saturday Group',schedule:'Saturday · 10:00',startDate:'2026-09-05',status:'active'},{id:'g-mon',name:'Monday Evening',schedule:'Monday · 18:30',startDate:'2026-09-07',status:'active'}],materials:[{id:'m1',filename:'Python_Foundations.pdf',mimeType:'application/pdf',sizeBytes:2048000,status:'processed'},{id:'m2',filename:'API_Workshop.pptx',mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation',sizeBytes:4300800,status:'processed'}],topics:[{id:'t1',title:'Python Basics',minutes:120},{id:'t2',title:'Control Flow',minutes:90},{id:'t3',title:'Functions',minutes:120},{id:'t4',title:'OOP Concepts',minutes:120},{id:'t5',title:'Classes & Inheritance',minutes:120},{id:'t6',title:'Git Essentials',minutes:90},{id:'t7',title:'Working with APIs',minutes:120},{id:'t8',title:'FastAPI',minutes:150},{id:'t9',title:'Databases',minutes:150},{id:'t10',title:'Final RAG Project',minutes:180}],edges:[['t1','t2'],['t2','t3'],['t3','t4'],['t4','t5'],['t3','t6'],['t3','t7'],['t7','t8'],['t8','t9'],['t9','t10'],['t8','t10']],progress:{'g-sat':['t1','t2','t3','t4'],'g-mon':['t1','t2']},attention:'t9',version:1};
const defaultState=()=>({courses:[],draft:null,screen:'dashboard',selectedCourse:null,selectedGroup:null,selectedNode:null,selectedNodeManually:false,showDetail:false,toast:'',groupText:'',extractPreview:null,genFailure:false,step:1,apiLoadStatus:'loading',apiError:'',demoMode:false,pendingGoalUpdates:{}});
let state={...defaultState(),...(safeLoad()||{})};let toastTimer;
function safeLoad(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(!v||v.version!==1)return null;const draft=v.draft||null;if(draft){draft.materials=(draft.materials||[]).map(m=>m.apiId?m:{...m,status:'Needs upload',errorMessage:'Selected in an older browser-only draft; select this file again to upload.'});if(!draft.apiRoadmapId&&(draft.step>=4||draft.status==='review')){draft.step=3;draft.status='draft';draft.topics=[];draft.edges=[];draft.genWarning='An earlier prototype roadmap was simulated and was not saved. Generate a real proposal for review.'}}return{courses:(v.courses||[]).filter(c=>c.apiCourseId&&!c.localOnly),draft,selectedCourse:v.selectedCourse||null,selectedGroup:v.selectedGroup||null}}catch{return null}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:1,courses:state.courses.filter(c=>c.apiCourseId&&!c.localOnly),draft:state.draft,selectedCourse:state.selectedCourse,selectedGroup:state.selectedGroup}))}catch{}}
function escape(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Math.random().toString(36).slice(2,10)}
function selectedCourse(){return state.courses.find(c=>c.id===state.selectedCourse)||null}
function group(){const c=selectedCourse();return c?.groups.find(g=>g.id===state.selectedGroup)||c?.groups[0]||null}
function notify(msg){state.toast=msg;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render()},2600)}
function createDraft(){if(state.draft){openDraft();return}state.draft={id:id(),name:'',description:'',learnerLevel:'',learningGoals:'',duration:'',groups:[],materials:[],topics:[],edges:[],status:'draft',step:1,createdAt:new Date().toISOString()};state.screen='wizard';state.step=1;render()}
function openDraft(){if(!state.draft)createDraft();else{state.screen='wizard';state.step=state.draft.step||1;render()}}
function sidebar(){return `<aside class="sidebar"><div class="brand"><span class="brandmark">↗</span><span>TeachFlow</span></div><nav class="nav"><button class="${state.screen==='dashboard'?'active':''}" data-action="dashboard"><span class="ico">⌂</span><span>Dashboard</span></button><button class="${state.screen==='roadmap'?'active':''}" data-action="roadmap"><span class="ico">⌁</span><span>Roadmaps</span></button><button data-action="materials"><span class="ico">▤</span><span>Materials</span></button><button data-action="approvals"><span class="ico">✓</span><span>Approvals</span><span class="nav-count">2</span></button><button data-action="assistant"><span class="ico">✧</span><span>AI Assistant</span></button></nav><div class="side-bottom"><div class="help"><strong>Need help?</strong>Ask the AI assistant for course or session guidance.</div></div></aside>`}
function topbar(){const c=selectedCourse();const g=group();const done=(c?.progress?.[g?.id]||[]).length,total=c?.topics?.length||0,percent=Math.round(done/Math.max(total,1)*100);return `<header class="topbar"><div class="top-left">${state.courses.length?`<select class="select" id="course-select" aria-label="Select course">${state.courses.map(x=>`<option value="${x.id}" ${x.id===state.selectedCourse?'selected':''}>⌂  ${escape(x.name)}</option>`).join('')}</select>${c?.groups.length?`<select class="select" id="group-select" aria-label="Select group">${c.groups.map(g=>`<option value="${g.id}" ${g.id===state.selectedGroup?'selected':''}>♧  ${escape(g.name)}</option>`).join('')}</select>`:''}`:`<span class="muted small">Instructor workspace</span>`}</div><div class="top-right">${c?`<div class="top-progress"><span class="top-progress-copy"><strong>${done} / ${total}</strong> sessions completed</span><span class="top-progress-track"><i style="width:${percent}%"></i></span></div>`:''}<span class="muted small">Instructor</span><div class="profile" aria-label="Instructor profile">I</div></div></header>`}
function empty(){return `<section class="empty"><div><div class="eyebrow">A calmer way to plan your teaching</div><h1>Your next course starts here.</h1><p>Add your teaching materials and let TeachFlow turn them into a structured roadmap, ready for your review.</p><div class="actions"><button class="btn primary" data-action="create">Create your first course <span aria-hidden="true">→</span></button><button class="btn" data-action="how">See how it works</button></div><div class="steps"><div class="stepmini"><span class="stepnum">1</span>Add course information</div><div class="stepmini"><span class="stepnum">2</span>Add teaching materials</div><div class="stepmini"><span class="stepnum">3</span>Review and approve</div></div><div class="small muted" style="margin-top:22px"><button class="btn" data-action="sample">Explore sample course</button> <span>Uses local demonstration data.</span></div></div><div class="preview" aria-label="Muted roadmap preview"><svg viewBox="0 0 420 300"><path d="M55 210 C80 210 83 80 145 80 S205 220 254 220 S305 100 365 110" fill="none" stroke="#dedfd6" stroke-width="3" stroke-dasharray="4 7"/><circle cx="55" cy="210" r="18" fill="#e1eae3" stroke="#708a7b"/><circle cx="145" cy="80" r="18" fill="#e2ebf2" stroke="#789bb8"/><circle cx="254" cy="220" r="18" fill="#efeee7" stroke="#a4a5a3"/><circle cx="365" cy="110" r="18" fill="#efeee7" stroke="#a4a5a3"/><circle cx="55" cy="210" r="4" fill="#708a7b"/><circle cx="145" cy="80" r="4" fill="#789bb8"/><circle cx="254" cy="220" r="4" fill="#a4a5a3"/><circle cx="365" cy="110" r="4" fill="#a4a5a3"/></svg><span class="preview-label">A learning path shaped around your course</span></div></section>`}
function stepper(){const labels=['Course details','Groups & schedule','Materials','Generate roadmap','Review & approve'];return `<div class="stepper">${labels.map((x,i)=>`<div class="step-pill ${state.step===i+1?'current':state.step>i+1?'done':''}">${state.step>i+1?'✓ ':''}${i+1} ${x}</div>`).join('')}</div>`}
function step1(){const d=state.draft;return `<div class="panel form"><h2>Tell us about your course.</h2><p>Start with what you teach. TeachFlow will use this information together with your materials to propose a roadmap.</p><div class="field"><label for="name">Course name <span>Required</span></label><input id="name" value="${escape(d.name)}" placeholder="What course do you teach?" autocomplete="off"/><small class="small muted">Example: Python Development</small></div><div class="field"><label for="desc">Short description <span>Optional</span></label><textarea id="desc" placeholder="Describe the course in one sentence...">${escape(d.description)}</textarea></div><div class="row"><div class="field"><label for="level">Learner level <span>Optional</span></label><select id="level"><option value="">Select level</option>${['Beginner','Intermediate','Advanced','Mixed / not sure'].map(x=>`<option ${d.learnerLevel===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="duration">Course duration <span>Optional</span></label><input id="duration" value="${escape(d.duration)}" placeholder="e.g. 8 weeks or Oct–Dec"/></div></div><div class="field"><label for="goals">Learning goals <span>Optional</span></label><textarea id="goals" placeholder="One goal per line, or separate goals with commas">${escape(d.learningGoals)}</textarea><small class="small muted">A few goals help shape sessions. You can leave this blank.</small></div></div>`}
function groupCard(g,i){return `<div class="group" data-group="${g.id}"><div class="group-top"><strong>Group ${i+1}</strong><button class="remove" data-action="remove-group" data-id="${g.id}" aria-label="Remove group">Remove</button></div><input data-gfield="name" value="${escape(g.name)}" placeholder="Group name" aria-label="Group name"/><input data-gfield="schedule" value="${escape(g.schedule)}" placeholder="Days and start time · optional" aria-label="Meeting schedule"/><div class="row"><input data-gfield="duration" type="number" min="1" value="${escape(g.duration||'')}" placeholder="Minutes" aria-label="Session duration in minutes"/><input data-gfield="start" type="date" value="${escape(g.startDate||'')}" aria-label="Course start date"/></div></div>`}
function step2(){return `<div class="panel form"><h2>How do you teach this course?</h2><p>Set up your teaching groups. They can follow the same roadmap at different speeds and on different schedules.</p><div class="field"><label for="scheduleText">Describe your schedule <span>Optional</span></label><textarea id="scheduleText" placeholder="Example: I teach Python to four groups. Two meet on Saturday, and two meet on Monday. Each session lasts two hours.">${escape(state.groupText)}</textarea><button class="btn" data-action="extract" style="justify-self:start">Preview suggested groups</button></div>${state.extractPreview?`<div class="warning">Schedule preview from your description — verify every group and duration before adding it.<div style="margin-top:9px"><button class="btn" data-action="accept-extract">Add suggested groups</button> <button class="btn" data-action="clear-extract">Dismiss</button></div></div>`:''}<div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px"><strong>Groups <span class="muted small">(${state.draft.groups.length})</span></strong><button class="btn" data-action="add-group">＋ Add group</button></div><div class="groups">${state.draft.groups.map(groupCard).join('')||`<div class="muted small">No groups yet. You can add groups later.</div>`}</div><div class="panel" style="margin-top:18px;background:#faf9f4;padding:14px"><strong>Already using a calendar?</strong><div class="small muted" style="margin:4px 0 10px">Calendar connection is not available in this prototype.</div><button class="btn" disabled title="Calendar integration is not connected">Connect calendar · unavailable</button></div></div>`}
function step3(){const files=state.draft.materials;return `<div class="panel form"><h2>Bring your teaching materials.</h2><p>TeachFlow uses your existing content to build a roadmap grounded in what you actually teach.</p><label class="upload" for="file-input" style="display:block;cursor:pointer"><div style="font-size:27px;margin-bottom:5px">▤</div><strong>Drop your files here or browse files.</strong><div class="small" style="margin-top:5px">PDF, TXT, or Markdown · up to 10 MB each · text is extracted before AI analysis</div><input type="file" id="file-input" multiple accept=".pdf,.txt,.md" hidden/></label>${state.draft.genWarning?`<div class="warning">${escape(state.draft.genWarning)}</div>`:''}<div class="files">${files.map((f,i)=>`<div class="file"><div class="file-icon">${escape(f.ext.toUpperCase())}</div><div class="file-info"><strong>${escape(f.name)}</strong><span class="small muted">${formatBytes(f.size)} · <span class="status">${escape(f.status)}</span>${f.errorMessage?`<span class="small muted">${escape(f.errorMessage)}</span>`:''}</span></div><button data-action="remove-file" data-index="${i}" aria-label="Remove ${escape(f.name)}">×</button></div>`).join('')||'<p class="small muted">No materials selected. You can continue with your course description and learning goals.</p>'}</div><div class="small muted" style="margin-top:18px">Materials are uploaded to the configured TeachFlow server and extracted before generation. Extraction status does not mean an AI roadmap has been generated.</div></div>`}
function formatBytes(n){if(!n)return '0 B';let k=1024,u=['B','KB','MB','GB'],i=Math.floor(Math.log(n)/Math.log(k));return `${(n/Math.pow(k,i)).toFixed(i?1:0)} ${u[i]}`}
function roadmapSvg(topics,edges,positions){return `<svg viewBox="0 0 660 460" aria-hidden="true">${edges.map(([a,b])=>{let p=positions[a],q=positions[b];if(!p||!q)return '';let dx=q.x-p.x,dy=q.y-p.y;return `<path class="edge" d="M ${p.x} ${p.y} C ${p.x+dx*.42} ${p.y+dy*.1}, ${q.x-dx*.42} ${q.y-dy*.1}, ${q.x} ${q.y}"/>`}).join('')}</svg>`}
function positionsFor(topics){let p={};const coords=[[150,78],[340,78],[530,100],[80,205],[280,205],[150,325],[355,325],[210,420],[490,420],[80,420],[350,420],[490,300]];topics.forEach((t,i)=>{const point=coords[i];p[t.id]=point?{x:point[0],y:point[1]}:{x:80+(i%3)*205,y:78+Math.floor(i/3)*112}});return p}
function sessionGoals(t){return Array.isArray(t?.objectives)&&t.objectives.length?t.objectives:['Understand core ideas','Apply concepts in practice']}
function completedGoalIndexes(t,c,g){const saved=c?.goalProgress?.[g?.id]?.[t?.id];if(Array.isArray(saved))return saved;return (c?.progress?.[g?.id]||[]).includes(t?.id)?sessionGoals(t).map((_,i)=>i):[]}
function sessionGoalPercent(t,c,g){return Math.round(completedGoalIndexes(t,c,g).length/Math.max(sessionGoals(t).length,1)*100)}
function topicStatus(t,c,g){if(c?.attention===t.id)return 'attention';const n=completedGoalIndexes(t,c,g).length,total=sessionGoals(t).length;if(n>=total)return 'done';if(n)return 'active';const progress=c?.progress?.[g?.id]||[],edges=c?.edges||[];const firstAvailable=(c?.topics||[]).find(candidate=>!progress.includes(candidate.id)&&c?.attention!==candidate.id&&edges.filter(e=>e[1]===candidate.id).every(e=>progress.includes(e[0])));return firstAvailable?.id===t.id?'active':'upcoming'}
async function hydrateApiCourse(raw){
  const groups=(raw.groups||await apiRequest(`/courses/${raw.id}/groups`)).map(g=>({id:g.id,apiGroupId:g.id,courseId:raw.id,name:g.name,schedule:g.schedule_description||'',duration:g.session_duration_minutes||'',status:'active'}));
  const [materials,roadmap]=await Promise.all([
    apiRequest(`/courses/${raw.id}/materials`),
    apiRequest(`/courses/${raw.id}/roadmaps/approved`).catch(error=>{if(error.status===404)return null;throw error})
  ]);
  const progressRows=await Promise.all(groups.map(async g=>[g.id,await apiRequest(`/groups/${g.id}/progress`)]));
  const topics=[],edges=[],goalProgress={},progress={};
  if(roadmap){
    const topicsById=new Map(roadmap.topics.map(t=>[t.id,t]));
    const sessionsByTopic=new Map();
    for(const session of roadmap.sessions){
      const parent=topicsById.get(session.topic_id);
      if(!parent)continue;
      const item={id:session.stable_id,sessionId:session.id,apiSessionId:session.id,apiTopicId:session.topic_id,topicStableId:parent.stable_id,topicTitle:parent.title,title:session.title,description:session.description,objectives:session.learning_objectives?.length?session.learning_objectives:(parent.learning_objectives||[]),minutes:session.duration_minutes,supportNote:parent.support_note,supportingMaterialIds:session.supporting_material_ids||[],sequenceIndex:session.sequence_index,status:'planned'};
      topics.push(item);
      if(!sessionsByTopic.has(parent.stable_id))sessionsByTopic.set(parent.stable_id,[]);
      sessionsByTopic.get(parent.stable_id).push(item);
    }
    for(const sessions of sessionsByTopic.values()){
      sessions.sort((a,b)=>a.sequenceIndex-b.sequenceIndex);
      for(let i=1;i<sessions.length;i++)edges.push([sessions[i-1].id,sessions[i].id]);
    }
    for(const dependency of roadmap.dependencies||[]){
      const from=sessionsByTopic.get(dependency.prerequisite_topic_id)||[];
      const to=sessionsByTopic.get(dependency.dependent_topic_id)||[];
      if(from.length&&to.length)edges.push([from[from.length-1].id,to[0].id]);
    }
  }
  const sessionByApiId=new Map(topics.map(t=>[t.sessionId,t]));
  for(const [groupId,rows] of progressRows){
    goalProgress[groupId]={};progress[groupId]=[];
    for(const row of rows){
      const session=sessionByApiId.get(row.session_id);
      if(!session)continue;
      const savedIndexes=[...(row.completed_objective_indexes||[])].sort((a,b)=>a-b);
      const indexes=row.state==='completed'?sessionGoals(session).map((_,i)=>i):savedIndexes;
      goalProgress[groupId][session.id]=indexes;
      if(row.state==='completed'||(sessionGoals(session).length>0&&indexes.length>=sessionGoals(session).length))progress[groupId].push(session.id);
    }
  }

async function loadBackendCourses(){
  state.apiLoadStatus='loading';state.apiError='';
  try{
    const records=await apiRequest('/courses');
    const loaded=await Promise.all(records.map(hydrateApiCourse));
    if(state.demoMode)loaded.push(JSON.parse(JSON.stringify(demo)));
    state.courses=loaded;
    const previousCourse=state.selectedCourse;
    state.selectedCourse=loaded.some(c=>c.id===previousCourse)?previousCourse:(loaded[0]?.id||null);
    const current=selectedCourse();
    state.selectedGroup=current?.groups.some(g=>g.id===state.selectedGroup)?state.selectedGroup:(current?.groups[0]?.id||null);
    if(!current?.topics?.some(t=>t.id===state.selectedNode)){state.selectedNode=defaultRoadmapSession(current,group())?.id||null;state.selectedNodeManually=false}
    state.apiLoadStatus='ready';state.apiError='';persist();render();
  }catch(error){
    state.apiLoadStatus='error';state.apiError=error.message||'Could not load saved courses.';render();
  }
}

function roadmapPage(){const c=selectedCourse();if(!c)return empty();const g=group();const selected=(state.selectedNodeManually&&c.topics.find(t=>t.id===state.selectedNode))||defaultRoadmapSession(c,g)||c.topics.find(t=>t.id===state.selectedNode);if(selected)state.selectedNode=selected.id;const done=(c.progress?.[g?.id]||[]).length,total=c.topics.length,percent=Math.round(done/Math.max(total,1)*100);return `<section class="reference-roadmap ${state.showDetail?'with-detail':''}">${state.showDetail?'':`<button class="detail-panel-toggle" data-action="toggle-detail" aria-label="Show session details" aria-expanded="false" title="Show session details">◧</button>`}<div class="roadmap-header"><div><div class="eyebrow">${escape(c.name)} · ${g?escape(g.name):'All groups'}</div><h1>Course Roadmap</h1><p>Explore the course structure, track progress, and manage sessions for each group.</p></div><div class="roadmap-header-actions"><button class="btn" data-action="new-course">＋ New course</button></div></div>${c.localOnly||c.id==='py-course'?'<div class="warning">Local demonstration data. This roadmap and progress are not stored in the backend.</div>':''}<div class="roadmap-tabs"><button class="roadmap-tab active">Roadmap</button><button class="roadmap-tab" data-action="roadmap-list">List</button><button class="roadmap-tab" data-action="roadmap-progress">Progress</button></div><div class="roadmap-context"><div class="roadmap-legend"><span><i class="dot done"></i> Completed</span><span><i class="dot active"></i> In Progress</span><span><i class="dot"></i> Upcoming</span><span><i class="dot attn"></i> Needs attention</span></div><span class="muted small">${done}/${total} sessions complete · ${percent}% for ${escape(g?.name||'selected group')}</span></div><div class="roadmap-layout roadmap-stage">${roadmapCanvas(c.topics,c.edges,c,g)}${detailPanel(selected,c.topics.indexOf(selected),c.topics,c.edges,false,c)}</div></section>`}
function dashboard(){

v><div class="section-head"><h2>Up next</h2><span class="muted small">${nextTopics.length?`Next ${nextTopics.length} roadmap sessions`:'All sessions complete'}</span></div><div class="upcoming">${nextTopics.map((t,i)=>`<article class="session-card"><div class="session-meta"><span>Session ${String((c.topics||[]).indexOf(t)+1).padStart(2,'0')}</span><span>${t.minutes||90} min</span></div><strong>${escape(t.title)}</strong><div class="small muted">${i===0?'Ready to teach':'Upcoming'} · ${escape(selectedGroup?.name||'Selected group')}</div><button class="btn ghost small" style="padding:7px 0;margin-top:8px" data-action="open-session" data-id="${t.id}">View details →</button></article>`).join('')||`<article class="session-card"><strong>No upcoming sessions</strong><div class="small muted">Your selected group has completed the visible roadmap.</div></article>`}</div><div class="section-head"><h2>Your courses</h2><button class="btn" data-action="new-course">＋ Create course</button></div><div class="groups">${state.courses.map(x=>`<div class="group"><div class="eyebrow">${escape(x.status||'active')}</div><h3>${escape(x.name)}</h3><div class="small muted">${x.topics?.length||0} sessions · ${x.groups?.length||0} groups</div><button class="btn" style="margin-top:12px" data-action="open-course" data-id="${x.id}">Open course</button></div>`).join('')}</div></div>`;

function render(){const app=document.getElementById('app');const page=state.screen==='wizard'?wizard():state.screen==='roadmap'?roadmapPage():(state.apiLoadStatus==='loading'&&!state.courses.length?'<section class="empty"><div><h1>Loading your courses…</h1><p class="muted">Retrieving saved courses and group progress.</p></div></section>':dashboard());app.innerHTML=`<div class="app">${sidebar()}<main class="main">${topbar()}${state.apiLoadStatus==='error'?`<div class="warning" role="alert" style="margin:12px 16px 0">Could not refresh saved TeachFlow data: ${escape(state.apiError)}. The displayed data may be cached. <button class="btn" data-action="retry-load" style="margin-left:8px">Retry</button></div>`:''}<div class="content">${page}</div></main></div>${state.toast?`<div class="toast" role="status">${escape(state.toast)}</div>`:''}`;bindInputs();if(state.screen==='roadmap')requestAnimationFrame(()=>{if(state.roadmapZoom)zoom(state.roadmapZoom,false);else zoom(1,true)})}
function setField(idVal,key){let el=document.getElementById(idVal);if(el)state.draft[key]=el.value}
function bindInputs(){const schedule=document.getElementById('scheduleText');if(schedule)schedule.addEventListener('input',()=>{state.groupText=schedule.value;persist()});document.querySelectorAll('[data-gfield]').forEach(el=>el.addEventListener('input',()=>{let card=el.closest('[data-group]'),g=state.draft.groups.find(x=>x.id===card.dataset.group);if(g){g[el.dataset.gfield]=el.value;persist()}}));const file=document.getElementById('file-input');if(file)file.addEventListener('change',async()=>addFiles(file.files));const upload=document.querySelector('.upload');if(upload){for(const ev of ['dragenter','dragover'])upload.addEventListener(ev,e=>{e.preventDefault();upload.classList.add('dragover')});for(const ev of ['dragleave','drop'])upload.addEventListener(ev,e=>{e.preventDefault();upload.classList.remove('dragover');if(ev==='drop')addFiles(e.dataTransfer.files)})}const scroll=document.getElementById('roadmap-scroll');if(scroll){let dragging=false,sx,sy,left,top;scroll.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;dragging=true;sx=e.clientX;sy=e.clientY;left=scroll.scrollLeft;top=scroll.scrollTop;scroll.setPointerCapture(e.pointerId)});scroll.addEventListener('pointermove',e=>{if(dragging){scroll.scrollLeft=left-(e.clientX-sx);scroll.scrollTop=top-(e.clientY-sy)}});scroll.addEventListener('pointerup',()=>dragging=false)} }
async function addFiles(list){const d=state.draft;for(const f of list){const ext=f.name.split('.').pop().toLowerCase();if(!['pdf','txt','md'].includes(ext)){notify(`${f.name}: only PDF, TXT, and Markdown can be extracted`);continue}if(f.size>10*1024*1024){notify(`${f.name}: files must be 10 MB or smaller`);continue}if(d.materials.some(x=>x.filename===f.name&&x.apiId))continue;d.materials=d.materials.filter(x=>x.filename!==f.name||x.apiId);try{await ensureCourse(d);const body=new FormData();body.append('file',f);const m=await apiRequest(`/courses/${d.apiCourseId}/materials`,{method:'POST',body});d.materials.push({apiId:m.id,filename:m.filename,name:m.filename,ext,size:m.size_bytes,status:m.status,errorMessage:m.error_message});persist();render();if(m.error_message)notify(`${m.filename}: ${m.status} — ${m.error_message}`)}catch(e){notify(`${f.name}: upload failed — ${e.message}`)}}}
function extractSchedule(){const text=document.getElementById('scheduleText')?.value.trim()||'';state.groupText=text;if(!text){notify('Describe at least one group schedule before creating a preview.');return}const nums={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};const number=v=>Number(v)||nums[v.toLowerCase()]||0;const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];const meetings=[...text.matchAll(/(\d+|one|two|three|four|five|six|seven|eight|nine|ten)\s+meet(?:s)?\s+(?:on\s+)?(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)/gi)];let suggestions=[];for(const m of meetings){const count=number(m[1]),day=days.find(x=>x.toLowerCase()===m[2].toLowerCase());for(let i=0;i<count&&suggestions.length<30;i++)suggestions.push({id:id(),name:`${day} Group ${i+1}`,schedule:day,duration:''})}if(!suggestions.length){const mentioned=days.filter(day=>new RegExp(day,'i').test(text));const countMatch=text.match(/(\d+|one|two|three|four|five|six|seven|eight|nine|ten)\s+groups?/i);const count=Math.min(number(countMatch?.[1]||'')||mentioned.length,30);if(!mentioned.length||!count){state.extractPreview=null;notify('Could not infer groups and meeting days confidently. Add groups manually instead.');return}for(let i=0;i<count;i++){const day=mentioned[i%mentioned.length];suggestions.push({id:id(),name:`${day} Group ${Math.floor(i/mentioned.length)+1}`,schedule:day,duration:''})}}const duration=text.match(/(\d+|one|two|three|four|five|six)\s+(?:hours?|hrs?)/i);const minutes=duration?number(duration[1])*60:0;if(minutes)suggestions.forEach(g=>g.duration=String(minutes));state.extractPreview=suggestions;persist();render()}
function saveStepFields(){if(state.step===1){state.draft.name=document.getElementById('name')?.value.trim()||'';state.draft.description=document.getElementById('desc')?.value.trim()||'';state.draft.learnerLevel=document.getElementById('level')?.value||'';state.draft.duration=document.getElementById('duration')?.value||'';state.draft.learningGoals=document.getElementById('goals')?.value||''}}
async function continueWizard(){saveStepFields();if(state.step===1&&!state.draft.name){notify('Enter a course name to continue.');document.getElementById('name')?.focus();return}try{if(state.step<=2)await ensureCourse(state.draft);if(state.step===2)await syncGroups(state.draft);if(state.step===3){await ensureCourse(state.draft);await syncGroups(state.draft);state.step=4;state.draft.step=4;persist();startGeneration();return}}catch(e){notify(`Could not save course setup: ${e.message}`);return}state.step++;state.draft.step=state.step;persist();render()}
async function startGeneration(){const d=state.draft;state.genFailure=false;d.genError='';d.genStage='Requesting a roadmap proposal';d.genDescription='Sending your course details and extracted materials to the configured AI provider.';render();try{await ensureCourse(d);await syncGroups(d);const r=await apiRequest(`/courses/${d.apiCourseId}/roadmaps/generate`,{method:'POST',headers:{'Idempotency-Key':d.id}});d.apiRoadmapId=r.id;d.roadmapProposal=r;const topicById=new Map(r.topics.map(t=>[t.id,t]));const sessions=[...r.sessions].sort((a,b)=>r.topics.indexOf(topicById.get(a.topic_id))-r.topics.indexOf(topicById.get(b.topic_id))||a.sequence_index-b.sequence_index);d.topics=sessions.map(s=>{const t=topicById.get(s.topic_id);return{id:s.stable_id,topicStableId:t.stable_id,topicTitle:t.title,title:s.title,description:s.description,objectives:s.learning_objectives?.length?s.learning_objectives:t.learning_objectives,minutes:s.duration_minutes,supportNote:t.support_note,supportingMaterialIds:s.supporting_material_ids}});const first=new Map(),last=new Map(),edges=[];for(const x of d.topics){if(!first.has(x.topicStableId))first.set(x.topicStableId,x.id);if(last.has(x.topicStableId))edges.push([last.get(x.topicStableId),x.id]);last.set(x.topicStableId,x.id)}for(const e of r.dependencies){const a=last.get(e.prerequisite_topic_id),b=first.get(e.dependent_topic_id);if(a&&b)edges.push([a,b])}d.edges=edges;d.genWarnings=r.warnings||[];d.genWarning=d.genWarnings.join(' ');state.step=5;d.step=5;state.selectedNode=d.topics[0]?.id;state.showDetail=true;persist();render()}catch(e){state.genFailure=true;d.genError=e.message;d.genStage='Roadmap generation unavailable';d.genDescription='Your information is saved. No roadmap was fabricated or created.';render()}}
function acyclic(edges){const adj={};edges.forEach(([a,b])=>(adj[a]??=[]).push(b));const visiting=new Set(),done=new Set();function visit(x){if(visiting.has(x))return false;if(done.has(x))return true;visiting.add(x);for(const y of adj[x]||[])if(!visit(y))return false;visiting.delete(x);done.add(x);return true}return Object.keys(adj).every(visit)}
function reviewEdit(action){const d=state.draft,t=d.topics.find(x=>x.id===state.selectedNode);if(action==='edit'){if(!t)return;const title=document.getElementById('edit-title');if(title)t.title=title.value.trim()||t.title;const desc=document.getElementById('edit-desc');if(desc)t.description=desc.value;const obj=document.getElementById('edit-objectives');if(obj)t.objectives=obj.value.split('\n').map(x=>x.trim()).filter(Boolean);const min=document.getElementById('edit-minutes');if(min)t.minutes=Math.max(1,Number(min.value)||90);const checks=[...document.querySelectorAll('[data-prereq]')];if(checks.length){const old=d.edges.filter(e=>e[1]!==t.id);const next=[...old,...checks.filter(x=>x.checked).map(x=>[x.dataset.prereq,t.id])];if(!acyclic(next)){notify('That prerequisite would create a cycle. The previous relationships are kept.')}else d.edges=next}persist()}}
async function toggleGoal(topicId,index){const c=selectedCourse(),g=group(),t=c?.topics.find(x=>x.id===topicId);if(!c||!g||!t)return;const key=`${g.id}:${topicId}`;if(state.pendingGoalUpdates?.[key])return;const shouldSave=Boolean(t.sessionId&&c.apiCourseId&&!c.localOnly),goals=sessionGoals(t),previous=[...completedGoalIndexes(t,c,g)],next=new Set(previous);if(next.has(index))next.delete(index);else next.add(index);const indexes=[...next].sort((a,b)=>a-b);c.goalProgress={...(c.goalProgress||{}),[g.id]:{...(c.goalProgress?.[g.id]||{}),[topicId]:indexes}};const complete=indexes.length===goals.length;c.progress={...(c.progress||{}),[g.id]:complete?[...new Set([...(c.progress?.[g.id]||[]),topicId])]: (c.progress?.[g.id]||[]).filter(id=>id!==topicId)};if(shouldSave)state.pendingGoalUpdates[key]=true;persist();render();if(!shouldSave)return;try{await apiRequest(`/groups/${g.id}/sessions/${t.sessionId}/progress`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed_objective_indexes:indexes})})}catch(e){c.goalProgress[g.id][topicId]=previous;c.progress[g.id]=(c.progress[g.id]||[]).filter(id=>id!==topicId);if(previous.length===goals.length)c.progress[g.id].push(topicId);notify(`Progress was not saved: ${e.message}. Your previous saved state has been restored.`)}finally{delete state.pendingGoalUpdates[key];persist();render()}}
async function toggleProgress(topicId){
  const c=selectedCourse(),g=group(),t=c?.topics.find(x=>x.id===topicId);
  if(!c||!g||!t)return;
  const current=c.progress||{};const done=new Set(current[g.id]||[]);const nextDone=!done.has(topicId);
  if(nextDone)done.add(topicId);else done.delete(topicId);
  c.progress={...current,[g.id]:[...done]};persist();render();notify(nextDone?'Session marked complete for this group.':'Session reopened for this group.');
  if(t.sessionId&&!c.localOnly&&c.id!=='py-course'){
    try{await apiRequest(`/groups/${g.id}/sessions/${t.sessionId}/progress`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:nextDone?'completed':'upcoming'})})}
    catch(e){done.has(topicId)?done.delete(topicId):done.add(topicId);c.progress[g.id]=[...done];persist();render();notify(`Could not save progress: ${e.message}`)}
  }
}
async function approve(draftOnly=false){const d=state.draft;if(!d.name.trim()){notify('Course name is required.');return}try{const saved=await apiRequest(`/roadmaps/${d.apiRoadmapId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(proposalForSave(d))});if(!draftOnly)await apiRequest(`/roadmaps/${d.apiRoadmapId}/approve`,{method:'POST'});let course=state.courses.find(x=>x.id===d.apiCourseId);if(!course){course={id:d.apiCourseId,ownerId:'instructor',createdAt:d.createdAt};state.courses.push(course)}Object.assign(course,{apiCourseId:d.apiCourseId,name:d.name,description:d.description,learnerLevel:d.learnerLevel,learningGoals:d.learningGoals.split(/[\n,]/).map(x=>x.trim()).filter(Boolean),status:draftOnly?'draft':'active',groups:d.groups.map(g=>({...g,id:g.apiGroupId||g.id,courseId:d.apiCourseId,status:'active'})),materials:d.materials.map(m=>({...m,courseId:d.apiCourseId})),topics:d.topics.map((x,i)=>({...x,sessionId:saved.sessions?.find(s=>s.stable_id===x.id)?.id||null,courseId:d.apiCourseId,sequenceIndex:i+1,status:'planned'})),edges:d.edges.map(([a,b])=>[a,b]),version:saved.version_number,approvedAt:draftOnly?null:new Date().toISOString(),progress:{}});state.selectedCourse=course.id;state.selectedGroup=course.groups[0]?.id||null;if(draftOnly){d.status='draft';persist()}else{state.draft=null;persist()}state.screen=draftOnly?'dashboard':'roadmap';state.showDetail=!draftOnly;state.selectedNode=course.topics[0]?.id||null;render();notify(draftOnly?'Roadmap draft saved. It remains inactive.':'Roadmap approved and activated.')}catch(e){notify(`Could not save roadmap: ${e.message}`)}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){case'retry-load':await loadBackendCourses();break;case'create':case'new-course':createDraft();break;case'dashboard':state.screen='dashboard';render();break;case'courses':state.screen='dashboard';render();break;case'open-session':state.screen='roadmap';state.selectedNode=b.dataset.id;state.selectedNodeManually=true;state.showDetail=true;persist();render();break;case'toggle-progress':await toggleProgress(b.dataset.id);break;case'toggle-goal':await toggleGoal(b.dataset.id,Number(b.dataset.index));break;case'roadmap':if(!selectedCourse()){notify('Create or select a course to open its roadmap.');return}state.screen='roadmap';state.showDetail=true;if(!selectedCourse()?.topics?.some(t=>t.id===state.selectedNode))state.selectedNode=defaultRoadmapSession(selectedCourse(),group())?.id||null;state.selectedNodeManually=false;persist();render();break;case'materials':case'approvals':case'assistant':case'roadmap-list':case'roadmap-progress':notify('This section is not part of the current prototype.');break;case'close-detail':state.showDetail=false;persist();render();break;case'toggle-detail':state.showDetail=!state.showDetail;if(state.showDetail&&!selectedCourse()?.topics?.some(t=>t.id===state.selectedNode))state.selectedNode=defaultRoadmapSession(selectedCourse(),group())?.id||null;persist();render();break;case'how':document.body.insertAdjacentHTML('beforeend',`<div class="overlay" data-modal="how"><div class="modal"><h2>How TeachFlow works</h2><p class="muted">Add a course and the materials you already use. TeachFlow proposes connected topics and sessions. You review and edit the roadmap before approving it. Each group then tracks its own progress.</p><button class="btn primary" data-action="close-modal">Got it</button></div></div>`);break;case'close-modal':document.querySelector('[data-modal]')?.remove();break;case'close-wizard':saveStepFields();persist();state.screen='dashboard';render();break;case'continue':continueWizard();break;case'back':if(state.step===5){state.step=3;state.draft.step=3}else if(state.step>1){state.step--;state.draft.step=state.step}persist();render();break;case'add-group':saveStepFields();state.draft.groups.push({id:id(),name:`Group ${state.draft.groups.length+1}`,schedule:'',duration:'',startDate:''});persist();render();break;case'remove-group':state.draft.groups=state.draft.groups.filter(g=>g.id!==b.dataset.id);persist();render();break;case'extract':extractSchedule();break;case'accept-extract':state.draft.groups.push(...(state.extractPreview||[]));state.extractPreview=null;persist();render();break;case'clear-extract':state.extractPreview=null;render();break;case'remove-file':await removeMaterial(Number(b.dataset.index));break;case'retry-gen':startGeneration();break;case'select-node':if(state.screen==='wizard'&&state.draft)reviewEdit('edit');state.selectedNode=b.dataset.id;state.selectedNodeManually=true;state.showDetail=true;persist();render();break;case'save-draft':reviewEdit('edit');await approve(true);break;case'approve':reviewEdit('edit');await approve(false);break;case'open-course':state.selectedCourse=b.dataset.id;state.selectedGroup=selectedCourse()?.groups[0]?.id||null;state.screen='roadmap';state.selectedNode=defaultRoadmapSession(selectedCourse(),group())?.id||null;state.selectedNodeManually=false;state.showDetail=true;persist();render();break;case'zoom-in':zoom(1.15);break;case'zoom-out':zoom(.87);break;case'fullscreen':{const card=document.querySelector('.roadmap-card');if(card){const full=card.classList.toggle('is-fullscreen');b.setAttribute('aria-label',full?'Exit full screen roadmap':'Full screen roadmap');b.title=full?'Exit full screen':'Full screen roadmap';b.textContent=full?'×':'⛶';if(full)requestAnimationFrame(()=>zoom(1,true))}break}case'add-topic':{reviewEdit('edit');const current=state.draft.topics.find(x=>x.id===state.selectedNode);if(!current)break;const peers=state.draft.topics.filter(x=>x.topicStableId===current.topicStableId),sequenceIndex=Math.max(...peers.map(x=>x.sequenceIndex||state.draft.roadmapProposal.sessions.find(s=>s.stable_id===x.id)?.sequence_index||1))+1,t={id:id(),topicStableId:current.topicStableId,topicTitle:current.topicTitle,sequenceIndex,title:'New session',description:'',objectives:current.objectives||[],minutes:90};state.draft.topics.push(t);state.draft.edges.push([peers[peers.length-1].id,t.id]);state.selectedNode=t.id;persist();render();break}case'delete-topic':{const deps=state.draft.edges.filter(x=>x[0]===b.dataset.id||x[1]===b.dataset.id);if(deps.length&&!confirm('This session has prerequisite relationships. Delete it and remove those relationships?'))return;state.draft.topics=state.draft.topics.filter(x=>x.id!==b.dataset.id);state.draft.edges=state.draft.edges.filter(x=>x[0]!==b.dataset.id&&x[1]!==b.dataset.id);state.selectedNode=state.draft.topics[0]?.id;persist();render();break}case'regen-topic':notify('Section regeneration is not available.');break}}
);
document.addEventListener('change',e=>{if(e.target.id==='course-select'){state.selectedCourse=e.target.value;const c=selectedCourse();state.selectedGroup=c?.groups[0]?.id||null;state.selectedNode=defaultRoadmapSession(c,group())?.id||null;state.selectedNodeManually=false;state.showDetail=state.screen==='roadmap';persist();render()}if(e.target.id==='group-select'){state.selectedGroup=e.target.value;state.selectedNode=defaultRoadmapSession(selectedCourse(),group())?.id||null;persist();render()}});
document.addEventListener('input',e=>{if(e.target.id==='edit-title'||e.target.id==='edit-desc'||e.target.id==='edit-objectives'||e.target.id==='edit-minutes'){/* edits are committed before navigation or approval */}});
function zoom(factor=1,fit=false){const el=document.getElementById('roadmap-inner'),wrap=document.getElementById('roadmap-scroll'),canvas=document.getElementById('roadmap-canvas-size');if(!el||!wrap||!canvas)return;const previous=Number(el.dataset.zoom||1),next=fit?Math.max(.35,Math.min(1.6,(wrap.clientWidth-32)/660,(wrap.clientHeight-32)/460)):Math.max(.45,Math.min(1.6,previous*factor)),cx=(wrap.scrollLeft+wrap.clientWidth/2)/previous,cy=(wrap.scrollTop+wrap.clientHeight/2)/previous;state.roadmapZoom=next;el.dataset.zoom=String(next);el.style.transform=`scale(${next})`;canvas.style.width=`${660*next}px`;canvas.style.height=`${460*next}px`;canvas.style.marginLeft='auto';canvas.style.marginRight='auto';if(fit)wrap.scrollTo({left:Math.max(0,(660*next-wrap.clientWidth)/2),top:Math.max(0,(460*next-wrap.clientHeight)/2),behavior:'smooth'});else requestAnimationFrame(()=>wrap.scrollTo({left:Math.max(0,cx*next-wrap.clientWidth/2),top:Math.max(0,cy*next-wrap.clientHeight/2),behavior:'smooth'}))}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='resume-draft'){openDraft()}if(b.dataset.action==='sample'){state.demoMode=true;state.courses=[...state.courses.filter(c=>c.apiCourseId),JSON.parse(JSON.stringify(demo))];state.selectedCourse=demo.id;state.selectedGroup=demo.groups[0].id;state.screen='roadmap';state.showDetail=true;state.selectedNode=demo.topics[2].id;persist();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const card=document.querySelector('.roadmap-card.is-fullscreen');if(card){card.classList.remove('is-fullscreen');const button=card.querySelector('[data-action="fullscreen"]');if(button){button.textContent='⛶';button.title='Full screen roadmap';button.setAttribute('aria-label','Full screen roadmap')}}}});
render();
