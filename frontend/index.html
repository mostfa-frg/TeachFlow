n:absolute;right:15px;top:15px;z-index:2;display:flex;gap:5px}.iconbtn{width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:8px}.roadmap-scroll{height:100%;min-height:560px;overflow:auto;cursor:grab}.roadmap-scroll:active{cursor:grabbing}.roadmap-inner{position:relative;width:900px;height:540px;transform-origin:top left;padding:1px}.roadmap-inner svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edge{fill:none;stroke:#d8d9d0;stroke-width:2}.node{position:absolute;transform:translate(-50%,-50%);width:142px;min-height:76px;border:1px solid var(--border);border-radius:13px;background:#fffefa;padding:10px;cursor:pointer;text-align:left;box-shadow:0 4px 14px #252b2a12;transition:transform .18s,box-shadow .18s}.node:hover{transform:translate(-50%,-50%) scale(1.03)}.node.selected{outline:3px solid #789bb844;border-color:var(--blue)}.node .nmeta{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-bottom:5px}.node strong{display:block;font-size:12px;line-height:1.3}.node.done{background:var(--sage-soft);border-color:#cfddd1}.node.active{background:var(--blue-soft);border-color:#bfd0dc;box-shadow:0 0 0 6px #789bb81b}.node.attention{background:var(--terra-soft);border-color:#e7c9ba}.node.optional{background:var(--lav-soft);border-color:#dad6e7}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--sub);font-size:11px;margin:13px 0}.legend span{display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--node)}.dot.done{background:var(--sage)}.dot.active{background:var(--blue)}.dot.attn{background:var(--terra)}.detail{width:360px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:20px;position:relative}.detail h3{margin:8px 0;font-size:20px;font-weight:590}.detail-section{border-top:1px solid var(--border);padding:14px 0}.detail-section h4{font-size:12px;color:var(--sub);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}.detail ul{padding-left:19px;margin:0}.detail li{margin:5px 0}.badge{display:inline-block;background:var(--blue-soft);color:#526f86;border-radius:20px;padding:4px 9px;font-size:11px}.summary{display:flex;gap:10px;margin:15px 0}.metric{flex:1;padding:11px;background:#faf9f4;border-radius:10px}.metric strong{display:block;font-size:18px;font-variant-numeric:tabular-nums}.toast{position:fixed;bottom:20px;right:22px;background:#34463b;color:white;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:20}.overlay{position:fixed;inset:0;background:#252b2a55;display:grid;place-items:center;padding:18px;z-index:10}.modal{max-width:470px;background:var(--surface);padding:25px;border-radius:15px;box-shadow:var(--shadow)}.modal h2{margin-top:0}.progress{height:5px;background:var(--muted);border-radius:6px;overflow:hidden;margin:15px 0}.progress i{display:block;height:100%;background:var(--sage);transition:width .3s}.warning{background:var(--terra-soft);color:#81513e;padding:10px 12px;border-radius:9px;font-size:12px;margin:14px 0}.hide{display:none!important}.mobile-menu{display:none}@media(max-width:900px){.app{grid-template-columns:68px minmax(0,1fr)}.sidebar{padding:20px 9px}.brand{padding:0 9px 25px}.brand span:last-child,.nav button span:last-child,.help{display:none}.nav button{justify-content:center;padding:12px 8px}.side-bottom{display:none}.content{padding:24px 20px}.detail{width:310px}.empty{gap:22px}}@media(max-width:650px){.app{display:block}.sidebar{display:none}.topbar{padding:0 14px;height:58px}.select{max-width:145px;padding:7px;font-size:12px}.top-right .muted{display:none}.content{padding:20px 14px}.empty{grid-template-columns:1fr;min-height:unset;padding:32px 0}.preview{height:190px;grid-row:1}.empty h1{font-size:37px}.steps{gap:11px}.row{grid-template-columns:1fr}.panel{padding:18px}.stepper{margin:14px 0 18px}.roadmap-layout{display:block}.roadmap-card{min-height:440px}.roadmap-scroll{min-height:440px}.detail{width:auto;margin-top:12px}.wizard-head{display:block}.wizard-footer{position:sticky;bottom:0;background:var(--canvas);padding:10px 0}.page-title{font-size:25px}}
    .attention-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(240px,.75fr);gap:14px;margin:22px 0}.attention-card{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:18px;box-shadow:0 3px 12px #252b2a06}.attention-card h2{font-size:17px;margin:4px 0 5px;font-weight:600}.attention-card .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.attention-card.attn{border-color:#e7c9ba;background:linear-gradient(135deg,#fffefa 0%,#fdf4ee 100%)}.attention-card.approval{background:linear-gradient(135deg,#fffefa 0%,#f2f6f1 100%)}.attention-list{display:grid;gap:10px;margin-top:14px}.attention-item{display:flex;align-items:flex-start;gap:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13px}.attention-item:first-child{border-top:0;padding-top:0}.attention-item .dot{flex:none;margin-top:6px}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 0 12px}.section-head h2{font-size:18px;font-weight:600;margin:0}.upcoming{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.session-card{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:15px}.session-card strong{display:block;margin:5px 0 3px}.session-card .session-meta{display:flex;justify-content:space-between;gap:8px;color:var(--sub);font-size:12px}.progress-track{height:7px;background:var(--muted);border-radius:8px;overflow:hidden;margin:11px 0 7px}.progress-track i{display:block;height:100%;background:var(--sage);border-radius:8px}.progress-track.active i{background:var(--blue)}.context-note{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:12px}.detail-action{width:100%;margin-top:14px}.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--muted);border-color:var(--border)}@media(max-width:850px){.attention-grid{grid-template-columns:1fr}.upcoming{grid-template-columns:1fr 1fr}}@media(max-width:650px){.upcoming{grid-template-columns:1fr}.attention-card{padding:15px}}

<body>
<div id="app"></div>
<script>
(()=>{'use strict';
const KEY='teachflow.prototype.v1';
const API='/api/v1';
async function apiRequest(path,options={}){const r=await fetch(`${API}${path}`,options);if(r.status===204)return null;const d=await r.json();if(!r.ok)throw new Error(d?.error?.message||`Request failed (${r.status})`);return d}
function coursePayload(d){return{name:d.name,description:d.description||null,learner_level:d.learnerLevel?d.learnerLevel.toLowerCase().split('/')[0].trim():null,learning_goals:d.learningGoals.split(/[\n,]/).map(x=>x.trim()).filter(Boolean)}}
async function ensureCourse(d){const exists=Boolean(d.apiCourseId),r=await apiRequest(exists?`/courses/${d.apiCourseId}`:'/courses',{method:exists?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(coursePayload(d))});d.apiCourseId=r.id;persist()}
async function syncGroups(d){const current=await apiRequest(`/courses/${d.apiCourseId}/groups`);for(const g of d.groups){const old=current.find(x=>x.id===g.apiGroupId)||current.find(x=>x.name===g.name),payload={name:g.name,schedule_description:g.schedule||null,session_duration_minutes:g.duration?Number(g.duration):null};const r=await apiRequest(old?`/courses/${d.apiCourseId}/groups/${old.id}`:`/courses/${d.apiCourseId}/groups`,{method:old?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});g.apiGroupId=r.id}persist()}
function proposalForSave(d){const o=d.roadmapProposal,byId=new Map(d.topics.map(x=>[x.id,x]));const topics=o.topics.filter(t=>d.topics.some(x=>x.topicStableId===t.stable_id)).map(t=>{const x=d.topics.find(y=>y.topicStableId===t.stable_id);return{id:t.stable_id,title:t.title,description:t.description,learning_objectives:x?.objectives||t.learning_objectives,support_note:t.support_note}});for(const x of d.topics.filter(y=>y.isNewTopic))topics.push({id:x.topicStableId,title:x.topicTitle||x.title,description:x.description||x.title,learning_objectives:x.objectives?.length?x.objectives:[x.title],support_note:'Added by instructor during review.'});const sessions=d.topics.map(x=>{const old=o.sessions.find(y=>y.stable_id===x.id);return{id:x.id,topic_id:x.topicStableId,sequence_index:old?.sequence_index||x.sequenceIndex||1,title:x.title,description:x.description||x.title,duration_minutes:Number(x.minutes)||90,supporting_material_ids:old?.supporting_material_ids||[]}});const deps=new Map();for(const [a,b] of d.edges){const from=byId.get(a),to=byId.get(b);if(from&&to&&from.topicStableId!==to.topicStableId)deps.set(`${from.topicStableId}:${to.topicStableId}`,{prerequisite_topic_id:from.topicStableId,dependent_topic_id:to.topicStableId})}return{topics,sessions,dependencies:[...deps.values()],warnings:o.warnings||[]}}
async function removeMaterial(i){try{const m=state.draft.materials[i];if(m.apiId)await apiRequest(`/courses/${state.draft.apiCourseId}/materials/${m.apiId}`,{method:'DELETE'});state.draft.materials.splice(i,1);persist();render()}catch(e){notify(`Could not remove material: ${e.message}`)}}
const demo={id:'py-course',ownerId:'instructor',name:'Python Development',description:'A practical path from Python foundations to APIs, databases, and applied AI.',learnerLevel:'Beginner',learningGoals:['Build Python applications','Understand APIs and databases','Create a small RAG project'],status:'active',groups:[{id:'g-sat',name:'Saturday Group',schedule:'Saturday · 10:00',startDate:'2026-09-05',status:'active'},{id:'g-mon',name:'Monday Evening',schedule:'Monday · 18:30',startDate:'2026-09-07',status:'active'}],materials:[{id:'m1',filename:'Python_Foundations.pdf',mimeType:'application/pdf',sizeBytes:2048000,status:'processed'},{id:'m2',filename:'API_Workshop.pptx',mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation',sizeBytes:4300800,status:'processed'}],topics:[{id:'t1',title:'Python Basics',minutes:120},{id:'t2',title:'Control Flow',minutes:90},{id:'t3',title:'Functions',minutes:120},{id:'t4',title:'OOP Concepts',minutes:120},{id:'t5',title:'Classes & Inheritance',minutes:120},{id:'t6',title:'Git Essentials',minutes:90},{id:'t7',title:'Working with APIs',minutes:120},{id:'t8',title:'FastAPI',minutes:150},{id:'t9',title:'Databases',minutes:150},{id:'t10',title:'Final RAG Project',minutes:180}],edges:[['t1','t2'],['t2','t3'],['t3','t4'],['t4','t5'],['t3','t6'],['t3','t7'],['t7','t8'],['t8','t9'],['t9','t10'],['t8','t10']],progress:{'g-sat':['t1','t2','t3','t4'],'g-mon':['t1','t2']},attention:'t9',version:1};
const defaultState=()=>({courses:[],draft:null,screen:'dashboard',selectedCourse:null,selectedGroup:null,selectedNode:null,showDetail:false,toast:'',groupText:'',extractPreview:null,genFailure:false,step:1});
let state={...defaultState(),...(safeLoad()||{})};let toastTimer;
function safeLoad(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(!v||v.version!==1)return null;const draft=v.draft||null;if(draft){draft.materials=(draft.materials||[]).map(m=>m.apiId?m:{...m,status:'Needs upload',errorMessage:'Selected in an older browser-only draft; select this file again to upload.'});if(!draft.apiRoadmapId&&(draft.step>=4||draft.status==='review')){draft.step=3;draft.status='draft';draft.topics=[];draft.edges=[];draft.genWarning='An earlier prototype roadmap was simulated and was not saved. Generate a real proposal for review.'}}return{courses:(v.courses||[]).map(c=>c.apiCourseId?c:{...c,localOnly:true,progress:{}}),draft,selectedCourse:v.selectedCourse||null,selectedGroup:v.selectedGroup||null}}catch{return null}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:1,courses:state.courses,draft:state.draft,selectedCourse:state.selectedCourse,selectedGroup:state.selectedGroup}))}catch{}}
function escape(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Math.random().toString(36).slice(2,10)}
function selectedCourse(){return state.courses.find(c=>c.id===state.selectedCourse)||null}
function group(){const c=selectedCourse();return c?.groups.find(g=>g.id===state.selectedGroup)||c?.groups[0]||null}
function notify(msg){state.toast=msg;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render()},2600)}
function createDraft(){if(state.draft){openDraft();return}state.draft={id:id(),name:'',description:'',learnerLevel:'',learningGoals:'',duration:'',groups:[],materials:[],topics:[],edges:[],status:'draft',step:1,createdAt:new Date().toISOString()};state.screen='wizard';state.step=1;render()}
function openDraft(){if(!state.draft)createDraft();else{state.screen='wizard';state.step=state.draft.step||1;render()}}
function sidebar(){return `<aside class="sidebar"><div class="brand"><span class="brandmark">↗</span><span>TeachFlow</span></div><nav class="nav"><button class="${state.screen==='dashboard'?'active':''}" data-action="dashboard"><span class="ico">⌂</span><span>Dashboard</span></button><button class="${state.screen==='roadmap'?'active':''}" data-action="roadmap"><span class="ico">⌁</span><span>Roadmaps</span></button><button data-action="materials"><span class="ico">▤</span><span>Materials</span></button><button data-action="approvals"><span class="ico">✓</span><span>Approvals</span><span class="nav-count">2</span></button><button data-action="assistant"><span class="ico">✧</span><span>AI Assistant</span></button></nav><div class="side-bottom"><div class="help"><strong>Need help?</strong>Ask the AI assistant for course or session guidance.</div></div></aside>`}
function topbar(){const c=selectedCourse();const g=group();const done=(c?.progress?.[g?.id]||[]).length,total=c?.topics?.length||0,percent=Math.round(done/Math.max(total,1)*100);return `<header class="topbar"><div class="top-left">${state.courses.length?`<select class="select" id="course-select" aria-label="Select course">${state.courses.map(x=>`<option value="${x.id}" ${x.id===state.selectedCourse?'selected':''}>⌂  ${escape(x.name)}</option>`).join('')}</select>${c?.groups.length?`<select class="select" id="group-select" aria-label="Select group">${c.groups.map(g=>`<option value="${g.id}" ${g.id===state.selectedGroup?'selected':''}>♧  ${escape(g.name)}</option>`).join('')}</select>`:''}`:`<span class="muted small">Instructor workspace</span>`}</div><div class="top-right">${c?`<div class="top-progress"><span class="top-progress-copy"><strong>${done} / ${total}</strong> sessions completed</span><span class="top-progress-track"><i style="width:${percent}%"></i></span></div>`:''}<span class="muted small">Instructor</span><div class="profile" aria-label="Instructor profile">I</div></div></header>`}
function empty(){return `<section class="empty"><div><div class="eyebrow">A calmer way to plan your teaching</div><h1>Your next course starts here.</h1><p>Add your teaching materials and let TeachFlow turn them into a structured roadmap, ready for your review.</p><div class="actions"><button class="btn primary" data-action="create">Create your first course <span aria-hidden="true">→</span></button><button class="btn" data-action="how">See how it works</button></div><div class="steps"><div class="stepmini"><span class="stepnum">1</span>Add course information</div><div class="stepmini"><span class="stepnum">2</span>Add teaching materials</div><div class="stepmini"><span class="stepnum">3</span>Review and approve</div></div><div class="small muted" style="margin-top:22px"><button class="btn" data-action="sample">Explore sample course</button> <span>Uses local demonstration data.</span></div></div><div class="preview" aria-label="Muted roadmap preview"><svg viewBox="0 0 420 300"><path d="M55 210 C80 210 83 80 145 80 S205 220 254 220 S305 100 365 110" fill="none" stroke="#dedfd6" stroke-width="3" stroke-dasharray="4 7"/><circle cx="55" cy="210" r="18" fill="#e1eae3" stroke="#708a7b"/><circle cx="145" cy="80" r="18" fill="#e2ebf2" stroke="#789bb8"/><circle cx="254" cy="220" r="18" fill="#efeee7" stroke="#a4a5a3"/><circle cx="365" cy="110" r="18" fill="#efeee7" stroke="#a4a5a3"/><circle cx="55" cy="210" r="4" fill="#708a7b"/><circle cx="145" cy="80" r="4" fill="#789bb8"/><circle cx="254" cy="220" r="4" fill="#a4a5a3"/><circle cx="365" cy="110" r="4" fill="#a4a5a3"/></svg><span class="preview-label">A learning path shaped around your course</span></div></section>`}
function stepper(){const labels=['Course details','Groups & schedule','Materials','Generate roadmap','Review & approve'];return `<div class="stepper">${labels.map((x,i)=>`<div class="step-pill ${state.step===i+1?'current':state.step>i+1?'done':''}">${state.step>i+1?'✓ ':''}${i+1} ${x}</div>`).join('')}</div>`}
function step1(){const d=state.draft;return `<div class="panel form"><h2>Tell us about your course.</h2><p>Start with what you teach. TeachFlow will use this information together with your materials to propose a roadmap.</p><div class="field"><label for="name">Course name <span>Required</span></label><input id="name" value="${escape(d.name)}" placeholder="What course do you teach?" autocomplete="off"/><small class="small muted">Example: Python Development</small></div><div class="field"><label for="desc">Short description <span>Optional</span></label><textarea id="desc" placeholder="Describe the course in one sentence...">${escape(d.description)}</textarea></div><div class="row"><div class="field"><label for="level">Learner level <span>Optional</span></label><select id="level"><option value="">Select level</option>${['Beginner','Intermediate','Advanced','Mixed / not sure'].map(x=>`<option ${d.learnerLevel===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="duration">Course duration <span>Optional</span></label><input id="duration" value="${escape(d.duration)}" placeholder="e.g. 8 weeks or Oct–Dec"/></div></div><div class="field"><label for="goals">Learning goals <span>Optional</span></label><textarea id="goals" placeholder="One goal per line, or separate goals with commas">${escape(d.learningGoals)}</textarea><small class="small muted">A few goals help shape sessions. You can leave this blank.</small></div></div>`}
function groupCard(g,i){return `<div class="group" data-group="${g.id}"><div class="group-top"><strong>Group ${i+1}</strong><button class="remove" data-action="remove-group" data-id="${g.id}" aria-label="Remove group">Remove</button></div><input data-gfield="name" value="${escape(g.name)}" placeholder="Group name" aria-label="Group name"/><input data-gfield="schedule" value="${escape(g.schedule)}" placeholder="Days and start time · optional" aria-label="Meeting schedule"/><div class="row"><input data-gfield="duration" type="number" min="1" value="${escape(g.duration||'')}" placeholder="Minutes" aria-label="Session duration in minutes"/><input data-gfield="start" type="date" value="${escape(g.startDate||'')}" aria-label="Course start date"/></div></div>`}
function step2(){return `<div class="panel form"><h2>How do you teach this course?</h2><p>Set up your teaching groups. They can follow the same roadmap at different speeds and on different schedules.</p><div class="field"><label for="scheduleText">Describe your schedule <span>Optional</span></label><textarea id="scheduleText" placeholder="Example: I teach Python to four groups. Two meet on Saturday, and two meet on Monday. Each session lasts two hours.">${escape(state.groupText)}</textarea><button class="btn" data-action="extract" style="justify-self:start">Preview suggested groups</button></div>${state.extractPreview?`<div class="warning">Schedule preview from your description — verify every group and duration before adding it.<div style="margin-top:9px"><button class="btn" data-action="accept-extract">Add suggested groups</button> <button class="btn" data-action="clear-extract">Dismiss</button></div></div>`:''}<div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px"><strong>Groups <span class="muted small">(${state.draft.groups.length})</span></strong><button class="btn" data-action="add-group">＋ Add group</button></div><div class="groups">${state.draft.groups.map(groupCard).join('')||`<div class="muted small">No groups yet. You can add groups later.</div>`}</div><div class="panel" style="margin-top:18px;background:#faf9f4;padding:14px"><strong>Already using a calendar?</strong><div class="small muted" style="margin:4px 0 10px">Calendar connection is not available in this prototype.</div><button class="btn" disabled title="Calendar integration is not connected">Connect calendar · unavailable</button></div></div>`}
function step3(){const files=state.draft.materials;return `<div class="panel form"><h2>Bring your teaching materials.</h2><p>TeachFlow uses your existing content to build a roadmap grounded in what you actually teach.</p><label class="upload" for="file-input" style="display:block;cursor:pointer"><div style="font-size:27px;margin-bottom:5px">▤</div><strong>Drop your files here or browse files.</strong><div class="small" style="margin-top:5px">PDF, TXT, or Markdown · up to 10 MB each · text is extracted before AI analysis</div><input type="file" id="file-input" multiple accept=".pdf,.txt,.md" hidden/></label>${state.draft.genWarning?`<div class="warning">${escape(state.draft.genWarning)}</div>`:''}<div class="files">${files.map((f,i)=>`<div class="file"><div class="file-icon">${escape(f.ext.toUpperCase())}</div><div class="file-info"><strong>${escape(f.name)}</strong><span class="small muted">${formatBytes(f.size)} · <span class="status">${escape(f.status)}</span>${f.errorMessage?`<span class="small muted">${escape(f.errorMessage)}</span>`:''}</span></div><button data-action="remove-file" data-index="${i}" aria-label="Remove ${escape(f.name)}">×</button></div>`).join('')||'<p class="small muted">No materials selected. You can continue with your course description and learning goals.</p>'}</div><div class="small muted" style="margin-top:18px">Materials are uploaded to the configured TeachFlow server and extracted before generation. Extraction status does not mean an AI roadmap has been generated.</div></div>`}
function formatBytes(n){if(!n)return '0 B';let k=1024,u=['B','KB','MB','GB'],i=Math.floor(Math.log(n)/Math.log(k));return `${(n/Math.pow(k,i)).toFixed(i?1:0)} ${u[i]}`}
function roadmapSvg(topics,edges,positions){return `<svg viewBox="0 0 900 540" aria-hidden="true">${edges.map(([a,b])=>{let p=positions[a],q=positions[b];if(!p||!q)return '';let dx=q.x-p.x,dy=q.y-p.y;return `<path class="edge" d="M ${p.x} ${p.y} C ${p.x+dx*.42} ${p.y+dy*.1}, ${q.x-dx*.42} ${q.y-dy*.1}, ${q.x} ${q.y}"/>`}).join('')}</svg>`}
function positionsFor(topics){let p={};const coords=[[105,116],[310,116],[510,116],[710,116],[710,320],[510,320],[310,320],[105,320],[105,470],[310,470],[510,470],[710,470]];topics.forEach((t,i)=>{const point=coords[i];p[t.id]=point?{x:point[0],y:point[1]}:{x:100+(Math.floor(i/4)%2?600:0)+(i%4)*70,y:80+Math.floor(i/4)*160}});return p}
function topicStatus(t,c,g){if(c?.attention===t.id)return 'attention';let done=(c?.progress?.[g?.id]||[]).includes(t.id);if(done)return 'done';let pg=c?.progress?.[g?.id]||[];let edges=c?.edges||[];let available=(edges.filter(e=>e[1]===t.id).every(e=>pg.includes(e[0])));return available?'active':'upcoming'}
function roadmapCanvas(topics,edges,c,grp,editable=false){const positions=positionsFor(topics);return `<div class="roadmap-card"><div class="roadmap-tools"><button class="iconbtn" data-action="zoom-out" aria-label="Zoom out">−</button><button class="iconbtn" data-action="zoom-in" aria-label="Zoom in">＋</button><button class="iconbtn" data-action="fit" aria-label="Fit roadmap">⌗</button></div><div class="roadmap-scroll" id="roadmap-scroll"><div class="roadmap-inner" id="roadmap-inner">${roadmapSvg(topics,edges,positions)}${topics.map((t,i)=>{let p=positions[t.id],s=editable?'upcoming':topicStatus(t,c,grp);return `<button class="node ${s} ${state.selectedNode===t.id?'selected':''}" style="left:${p.x}px;top:${p.y}px" data-action="select-node" data-id="${t.id}" aria-label="Session ${i+1}: ${escape(t.title)}, ${s}"><span class="nmeta"><span>${String(i+1).padStart(2,'0')}</span><span>${s==='done'?'✓':s==='active'?'◉':s==='attention'?'!':s==='upcoming'?'○':'◇'} ${s==='done'?'Complete':s==='active'?'In progress':s==='attention'?'Review':s}</span></span><strong>${escape(t.title)}</strong><span class="small muted">${t.minutes||90} min</span></button>`}).join('')}</div></div></div>`}
function detailPanel(t,i,topics,edges,editable,c){
  if(!t)return `<aside class="detail reference-detail"><span class="muted small">Select a session node to see its details.</span></aside>`;
  const pred=edges.filter(e=>e[1]===t.id).map(e=>topics.find(x=>x.id===e[0])?.title).filter(Boolean);
  const successors=edges.filter(e=>e[0]===t.id).map(e=>topics.find(x=>x.id===e[1])?.title).filter(Boolean);
  const materials=(c?.materials||state.draft?.materials||[]).filter(m=>(t.supportingMaterialIds||[]).includes(m.apiId||m.id));
  const progressState=c&&group()?((c.progress?.[group().id]||[]).includes(t.id)?'completed':'upcoming'):'upcoming';
  const isComplete=progressState==='completed';
  return `<aside class="detail reference-detail"><div class="eyebrow">Session ${String(i+1).padStart(2,'0')} · ${topics.length} sessions</div>${editable?`<div class="field"><label>Session title</label><input id="edit-title" data-id="${t.id}" value="${escape(t.title)}"/></div>`:`<h3>${escape(t.title)}</h3>`}<span class="badge">${editable?'Proposed session':topicStatus(t,c,group())}</span>${editable&&t.supportNote?`<div class="warning">AI inference: ${escape(t.supportNote)}</div>`:''}${editable?`<div class="field"><label>What will be taught</label><textarea id="edit-desc" data-id="${t.id}">${escape(t.description||'')}</textarea></div>`:`<div class="detail-section"><h4>What will be taught</h4><div>${escape(t.description||'Build understanding and practice through guided exercises.')}</div></div>`}<div class="detail-section"><h4>Learning objectives</h4>${editable?`<textarea id="edit-objectives" data-id="${t.id}">${escape((t.objectives||[]).join('\n'))}</textarea>`:`<ul>${(t.objectives||['Understand core ideas','Apply concepts in practice']).map(x=>`<li>${escape(x)}</li>`).join('')}</ul>`}</div><div class="detail-section"><h4>Prerequisites</h4>${editable?`<div class="small muted">Select prerequisites (must remain acyclic)</div>${topics.filter(x=>x.id!==t.id).map(x=>`<label class="small" style="display:block;margin:5px 0"><input type="checkbox" data-prereq="${x.id}" ${edges.some(e=>e[0]===x.id&&e[1]===t.id)?'checked':''}/> ${escape(x.title)}</label>`).join('')}`:`${pred.map(escape).join(', ')||'No prerequisites'}${successors.length?`<div class="small muted" style="margin-top:6px">Unlocks: ${successors.map(escape).join(', ')}</div>`:''}`}</div><div class="detail-section"><h4>Materials</h4>${materials.length?materials.slice(0,3).map(m=>`<div class="small">▤ ${escape(m.filename||m.name)}</div>`).join(''):'<span class="small muted">No materials linked yet</span>'}</div><div class="detail-section"><strong>${editable?`<input type="number" id="edit-minutes" min="1" value="${Number(t.minutes)||90}" style="width:90px;padding:7px;border:1px solid var(--border);border-radius:7px"/> min estimate`:`${t.minutes||90} min estimated`}</strong>${editable?`<div style="margin-top:10px"><button class="btn" data-action="add-topic">＋ Add session</button> <button class="btn" data-action="delete-topic" data-id="${t.id}">Remove session</button></div>`:''}</div>${!editable?`<button class="btn ${isComplete?'ghost':''} detail-action" data-action="toggle-progress" data-id="${t.id}">${isComplete?'Reopen session':'Mark as complete'} ${isComplete?'↶':'✓'}</button><div class="context-note" style="margin-top:9px"><span class="dot ${isComplete?'done':'active'}"></span>${isComplete?'Recorded for this group':'Progress is tracked for the selected group'}</div>`:''}</aside>`;
}
function step4(){const d=state.draft;return `<div class="form"><h2>${state.genFailure?'Roadmap generation did not complete.':'Preparing a roadmap proposal.'}</h2><p>${state.genFailure?'Your course details are saved. Retry when the AI provider is available.':'TeachFlow is waiting for the configured AI provider. No simulated progress is shown.'}</p><div class="panel" aria-live="polite"><strong>${escape(d.genStage||'Waiting for provider')}</strong><div class="small muted" style="margin-top:8px">${escape(d.genError||d.genDescription||'A proposal appears after real generation and validation.')}</div>${state.genFailure?`<div style="margin-top:14px"><button class="btn primary" data-action="retry-gen">Retry generation</button> <button class="btn" data-action="back">Back to materials</button></div>`:`<div class="small muted" role="status">Waiting for the provider response; no synthetic progress is shown.</div>`}</div></div>`}
function step5(){const d=state.draft,t=d.topics.find(x=>x.id===state.selectedNode)||d.topics[0],hours=(d.topics.reduce((n,x)=>n+(Number(x.minutes)||0),0)/60).toFixed(1),warnings=d.genWarnings||[];return `<div class="wizard-head"><div><h2 class="page-title">Your roadmap is ready to review.</h2><p class="muted">This provider-generated proposal is not active until you approve it.</p></div><button class="btn" data-action="back">Back to edit</button></div><div class="summary"><div class="metric"><strong>${d.roadmapProposal.topics.length}</strong><span class="small muted">Topics</span></div><div class="metric"><strong>${d.topics.length}</strong><span class="small muted">Sessions</span></div><div class="metric"><strong>${hours}</strong><span class="small muted">Teaching hours</span></div><div class="metric"><strong>${d.edges.length}</strong><span class="small muted">Prerequisite links</span></div><div class="metric"><strong>${warnings.length}</strong><span class="small muted">Review notes</span></div></div>${warnings.length?`<div class="warning"><strong>Review these uncertainties</strong><ul>${warnings.map(x=>`<li>${escape(x)}</li>`).join('')}</ul></div>`:''}<div class="legend"><span><i class="dot"></i> Proposed</span><span class="muted small">Select a session to review; arrows show prerequisites.</span></div><div class="roadmap-layout">${roadmapCanvas(d.topics,d.edges,null,null,true)}${state.showDetail?detailPanel(t,d.topics.indexOf(t),d.topics,d.edges,true):''}</div><div class="wizard-footer"><button class="btn" data-action="save-draft">Save as draft</button><button class="btn primary" data-action="approve">Approve roadmap</button></div></div>`}
function wizard(){return `<section><div class="wizard-head"><div><div class="eyebrow">Course setup · Step ${state.step} of 5</div><h1 class="page-title">Create a course</h1><div class="small muted">Your progress is saved in this browser as you go.</div></div><button class="btn" data-action="close-wizard">Save and close</button></div>${stepper()}${state.step===1?step1():state.step===2?step2():state.step===3?step3():state.step===4?step4():step5()}${state.step<4?`<div class="wizard-footer"><button class="btn" data-action="${state.step===1?'close-wizard':'back'}">${state.step===1?'Cancel':'Back'}</button><button class="btn primary" data-action="continue">${state.step===1?'Continue to groups':state.step===2?'Continue to materials':'Generate roadmap'} →</button></div>`:''}</section>`}
function roadmapPage(){const c=selectedCourse();if(!c)return empty();const g=group();const selected=c.topics.find(t=>t.id===state.selectedNode)||c.topics[0];const done=(c.progress?.[g?.id]||[]).length,total=c.topics.length,percent=Math.round(done/Math.max(total,1)*100);return `<section class="reference-roadmap"><div class="roadmap-header"><div><div class="eyebrow">${escape(c.name)} · ${g?escape(g.name):'All groups'}</div><h1>Course Roadmap</h1><p>Explore the course structure, track progress, and manage sessions for each group.</p></div><div class="roadmap-header-actions"><button class="btn" data-action="new-course">＋ New course</button></div></div>${c.localOnly||c.id==='py-course'?'<div class="warning">Local demonstration data. This roadmap and progress are not stored in the backend.</div>':''}<div class="roadmap-tabs"><button class="roadmap-tab active">Roadmap</button><button class="roadmap-tab" data-action="roadmap-list">List</button><button class="roadmap-tab" data-action="roadmap-progress">Progress</button></div><div class="roadmap-context"><div class="roadmap-legend"><span><i class="dot done"></i> Completed</span><span><i class="dot active"></i> In Progress</span><span><i class="dot"></i> Upcoming</span><span><i class="dot attn"></i> Needs attention</span></div><span class="muted small">${done}/${total} sessions complete · ${percent}% for ${escape(g?.name||'selected group')}</span></div><div class="roadmap-layout roadmap-stage">${roadmapCanvas(c.topics,c.edges,c,g)}${state.showDetail?detailPanel(selected,c.topics.indexOf(selected),c.topics,c.edges,false,c):''}</div></section>`}
function dashboard(){
  if(!state.courses.length&&!state.draft)return empty();
  const c=selectedCourse();
  if(!c)return `<div><div class="eyebrow">Instructor dashboard</div><h1 class="page-title">Welcome back.</h1>${state.draft?`<div class="panel"><div class="eyebrow">Saved draft</div><h2>${escape(state.draft.name||'Untitled course')}</h2><p class="muted">Continue setting up your course and roadmap.</p><button class="btn primary" data-action="resume-draft">Resume draft →</button></div>`:''}<div style="margin-top:18px">${empty()}</div></div>`;
  const selectedGroup=group();
  const completed=(c.progress?.[selectedGroup?.id]||[]).length;
  const total=c.topics?.length||0;
  const percent=Math.round(completed/Math.max(total,1)*100);
  const attention=c.attention||c.topics?.find(t=>!(c.progress?.[selectedGroup?.id]||[]).includes(t.id))?.id;
  const attentionTopic=c.topics?.find(t=>t.id===attention);
  const nextTopics=(c.topics||[]).filter(t=>!(c.progress?.[selectedGroup?.id]||[]).includes(t.id)).slice(0,3);
  return `<div><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:15px"><div><div class="eyebrow">Instructor dashboard · ${selectedGroup?escape(selectedGroup.name):'No group selected'}</div><h1 class="page-title">Good to see you back.</h1><p class="muted">A quick view of what needs your attention across ${escape(c.name)}.</p></div><button class="btn primary" data-action="roadmap">Open roadmap →</button></div>${c.localOnly||c.id==='py-course'?'<div class="warning">This is local demonstration data. Changes here are not stored in the backend.</div>':''}${state.draft?`<div class="panel" style="margin-top:15px"><span class="eyebrow">Saved draft · ${escape(state.draft.name||'Untitled course')}</span> <button class="btn" data-action="resume-draft">Resume setup</button></div>`:''}<div class="attention-grid"><article class="attention-card attn"><div class="card-head"><div><div class="eyebrow">Needs your attention</div><h2>${attentionTopic?`Review ${escape(attentionTopic.title)}`:'Your roadmap is up to date'}</h2><p class="muted small">${attentionTopic?`This is the next unfinished session for ${escape(selectedGroup?.name||'the selected group')}. Open it to confirm progress or add a note.`:'No incomplete sessions are currently flagged.'}</p></div><span class="badge">${attentionTopic?'Next action':'Clear'}</span></div>${attentionTopic?`<button class="btn" style="margin-top:12px" data-action="open-session" data-id="${attentionTopic.id}">Open session →</button>`:''}</article><article class="attention-card approval"><div class="eyebrow">Course health at a glance</div><h2>${completed}/${total} sessions completed</h2><div class="progress-track"><i style="width:${percent}%"></i></div><div class="session-meta"><span>${percent}% for ${escape(selectedGroup?.name||'this group')}</span><span>${c.groups?.length||0} groups</span></div><p class="muted small" style="margin:12px 0 0">Progress is evidence-based and specific to the selected group.</p></article></div><div class="section-head"><h2>Up next</h2><span class="muted small">${nextTopics.length?`Next ${nextTopics.length} roadmap sessions`:'All sessions complete'}</span></div><div class="upcoming">${nextTopics.map((t,i)=>`<article class="session-card"><div class="session-meta"><span>Session ${String((c.topics||[]).indexOf(t)+1).padStart(2,'0')}</span><span>${t.minutes||90} min</span></div><strong>${escape(t.title)}</strong><div class="small muted">${i===0?'Ready to teach':'Upcoming'} · ${escape(selectedGroup?.name||'Selected group')}</div><button class="btn ghost small" style="padding:7px 0;margin-top:8px" data-action="open-session" data-id="${t.id}">View details →</button></article>`).join('')||`<article class="session-card"><strong>No upcoming sessions</strong><div class="small muted">Your selected group has completed the visible roadmap.</div></article>`}</div><div class="section-head"><h2>Your courses</h2><button class="btn" data-action="new-course">＋ Create course</button></div><div class="groups">${state.courses.map(x=>`<div class="group"><div class="eyebrow">${escape(x.status||'active')}</div><h3>${escape(x.name)}</h3><div class="small muted">${x.topics?.length||0} sessions · ${x.groups?.length||0} groups</div><button class="btn" style="margin-top:12px" data-action="open-course" data-id="${x.id}">Open course</button></div>`).join('')}</div></div>`;
}
function render(){const app=document.getElementById('app');app.innerHTML=`<div class="app">${sidebar()}<main class="main">${topbar()}<div class="content">${state.screen==='wizard'?wizard():state.screen==='roadmap'?roadmapPage():dashboard()}</div></main></div>${state.toast?`<div class="toast" role="status">${escape(state.toast)}</div>`:''}`;bindInputs()}
function setField(idVal,key){let el=document.getElementById(idVal);if(el)state.draft[key]=el.value}
function bindInputs(){const schedule=document.getElementById('scheduleText');if(schedule)schedule.addEventListener('input',()=>{state.groupText=schedule.value;persist()});document.querySelectorAll('[data-gfield]').forEach(el=>el.addEventListener('input',()=>{let card=el.closest('[data-group]'),g=state.draft.groups.find(x=>x.id===card.dataset.group);if(g){g[el.dataset.gfield]=el.value;persist()}}));const file=document.getElementById('file-input');if(file)file.addEventListener('change',async()=>addFiles(file.files));const upload=document.querySelector('.upload');if(upload){for(const ev of ['dragenter','dragover'])upload.addEventListener(ev,e=>{e.preventDefault();upload.classList.add('dragover')});for(const ev of ['dragleave','drop'])upload.addEventListener(ev,e=>{e.preventDefault();upload.classList.remove('dragover');if(ev==='drop')addFiles(e.dataTransfer.files)})}const scroll=document.getElementById('roadmap-scroll');if(scroll){let dragging=false,sx,sy,left,top;scroll.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;dragging=true;sx=e.clientX;sy=e.clientY;left=scroll.scrollLeft;top=scroll.scrollTop;scroll.setPointerCapture(e.pointerId)});scroll.addEventListener('pointermove',e=>{if(dragging){scroll.scrollLeft=left-(e.clientX-sx);scroll.scrollTop=top-(e.clientY-sy)}});scroll.addEventListener('pointerup',()=>dragging=false)} }
async function addFiles(list){const d=state.draft;for(const f of list){const ext=f.name.split('.').pop().toLowerCase();if(!['pdf','txt','md'].includes(ext)){notify(`${f.name}: only PDF, TXT, and Markdown can be extracted`);continue}if(f.size>10*1024*1024){notify(`${f.name}: files must be 10 MB or smaller`);continue}if(d.materials.some(x=>x.filename===f.name&&x.apiId))continue;d.materials=d.materials.filter(x=>x.filename!==f.name||x.apiId);try{await ensureCourse(d);const body=new FormData();body.append('file',f);const m=await apiRequest(`/courses/${d.apiCourseId}/materials`,{method:'POST',body});d.materials.push({apiId:m.id,filename:m.filename,name:m.filename,ext,size:m.size_bytes,status:m.status,errorMessage:m.error_message});persist();render();if(m.error_message)notify(`${m.filename}: ${m.status} — ${m.error_message}`)}catch(e){notify(`${f.name}: upload failed — ${e.message}`)}}}
function extractSchedule(){const text=document.getElementById('scheduleText')?.value.trim()||'';state.groupText=text;if(!text){notify('Describe at least one group schedule before creating a preview.');return}const nums={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};const number=v=>Number(v)||nums[v.toLowerCase()]||0;const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];const meetings=[...text.matchAll(/(\d+|one|two|three|four|five|six|seven|eight|nine|ten)\s+meet(?:s)?\s+(?:on\s+)?(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)/gi)];let suggestions=[];for(const m of meetings){const count=number(m[1]),day=days.find(x=>x.toLowerCase()===m[2].toLowerCase());for(let i=0;i<count&&suggestions.length<30;i++)suggestions.push({id:id(),name:`${day} Group ${i+1}`,schedule:day,duration:''})}if(!suggestions.length){const mentioned=days.filter(day=>new RegExp(day,'i').test(text));const countMatch=text.match(/(\d+|one|two|three|four|five|six|seven|eight|nine|ten)\s+groups?/i);const count=Math.min(number(countMatch?.[1]||'')||mentioned.length,30);if(!mentioned.length||!count){state.extractPreview=null;notify('Could not infer groups and meeting days confidently. Add groups manually instead.');return}for(let i=0;i<count;i++){const day=mentioned[i%mentioned.length];suggestions.push({id:id(),name:`${day} Group ${Math.floor(i/mentioned.length)+1}`,schedule:day,duration:''})}}const duration=text.match(/(\d+|one|two|three|four|five|six)\s+(?:hours?|hrs?)/i);const minutes=duration?number(duration[1])*60:0;if(minutes)suggestions.forEach(g=>g.duration=String(minutes));state.extractPreview=suggestions;persist();render()}
function saveStepFields(){if(state.step===1){state.draft.name=document.getElementById('name')?.value.trim()||'';state.draft.description=document.getElementById('desc')?.value.trim()||'';state.draft.learnerLevel=document.getElementById('level')?.value||'';state.draft.duration=document.getElementById('duration')?.value||'';state.draft.learningGoals=document.getElementById('goals')?.value||''}}
async function continueWizard(){saveStepFields();if(state.step===1&&!state.draft.name){notify('Enter a course name to continue.');document.getElementById('name')?.focus();return}try{if(state.step<=2)await ensureCourse(state.draft);if(state.step===2)await syncGroups(state.draft);if(state.step===3){await ensureCourse(state.draft);await syncGroups(state.draft);state.step=4;state.draft.step=4;persist();startGeneration();return}}catch(e){notify(`Could not save course setup: ${e.message}`);return}state.step++;state.draft.step=state.step;persist();render()}
async function startGeneration(){const d=state.draft;state.genFailure=false;d.genError='';d.genStage='Requesting a roadmap proposal';d.genDescription='Sending your course details and extracted materials to the configured AI provider.';render();try{await ensureCourse(d);await syncGroups(d);const r=await apiRequest(`/courses/${d.apiCourseId}/roadmaps/generate`,{method:'POST',headers:{'Idempotency-Key':d.id}});d.apiRoadmapId=r.id;d.roadmapProposal=r;const topicById=new Map(r.topics.map(t=>[t.id,t]));const sessions=[...r.sessions].sort((a,b)=>r.topics.indexOf(topicById.get(a.topic_id))-r.topics.indexOf(topicById.get(b.topic_id))||a.sequence_index-b.sequence_index);d.topics=sessions.map(s=>{const t=topicById.get(s.topic_id);return{id:s.stable_id,topicStableId:t.stable_id,topicTitle:t.title,title:s.title,description:s.description,objectives:t.learning_objectives,minutes:s.duration_minutes,supportNote:t.support_note,supportingMaterialIds:s.supporting_material_ids}});const first=new Map(),last=new Map(),edges=[];for(const x of d.topics){if(!first.has(x.topicStableId))first.set(x.topicStableId,x.id);if(last.has(x.topicStableId))edges.push([last.get(x.topicStableId),x.id]);last.set(x.topicStableId,x.id)}for(const e of r.dependencies){const a=last.get(e.prerequisite_topic_id),b=first.get(e.dependent_topic_id);if(a&&b)edges.push([a,b])}d.edges=edges;d.genWarnings=r.warnings||[];d.genWarning=d.genWarnings.join(' ');state.step=5;d.step=5;state.selectedNode=d.topics[0]?.id;state.showDetail=true;persist();render()}catch(e){state.genFailure=true;d.genError=e.message;d.genStage='Roadmap generation unavailable';d.genDescription='Your information is saved. No roadmap was fabricated or created.';render()}}
function acyclic(edges){const adj={};edges.forEach(([a,b])=>(adj[a]??=[]).push(b));const visiting=new Set(),done=new Set();function visit(x){if(visiting.has(x))return false;if(done.has(x))return true;visiting.add(x);for(const y of adj[x]||[])if(!visit(y))return false;visiting.delete(x);done.add(x);return true}return Object.keys(adj).every(visit)}
function reviewEdit(action){const d=state.draft,t=d.topics.find(x=>x.id===state.selectedNode);if(action==='edit'){if(!t)return;const title=document.getElementById('edit-title');if(title)t.title=title.value.trim()||t.title;const desc=document.getElementById('edit-desc');if(desc)t.description=desc.value;const obj=document.getElementById('edit-objectives');if(obj)t.objectives=obj.value.split('\n').map(x=>x.trim()).filter(Boolean);const min=document.getElementById('edit-minutes');if(min)t.minutes=Math.max(1,Number(min.value)||90);const checks=[...document.querySelectorAll('[data-prereq]')];if(checks.length){const old=d.edges.filter(e=>e[1]!==t.id);const next=[...old,...checks.filter(x=>x.checked).map(x=>[x.dataset.prereq,t.id])];if(!acyclic(next)){notify('That prerequisite would create a cycle. The previous relationships are kept.')}else d.edges=next}persist()}}
async function toggleProgress(topicId){
  const c=selectedCourse(),g=group(),t=c?.topics.find(x=>x.id===topicId);
  if(!c||!g||!t)return;
  const current=c.progress||{};const done=new Set(current[g.id]||[]);const nextDone=!done.has(topicId);
  if(nextDone)done.add(topicId);else done.delete(topicId);
  c.progress={...current,[g.id]:[...done]};persist();render();notify(nextDone?'Session marked complete for this group.':'Session reopened for this group.');
  if(t.sessionId&&!c.localOnly&&c.id!=='py-course'){
    try{await apiRequest(`/groups/${g.id}/sessions/${t.sessionId}/progress`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:nextDone?'completed':'upcoming'})})}
    catch(e){done.has(topicId)?done.delete(topicId):done.add(topicId);c.progress[g.id]=[...done];persist();render();notify(`Could not save progress: ${e.message}`)}
  }
}
async function approve(draftOnly=false){const d=state.draft;if(!d.name.trim()){notify('Course name is required.');return}try{const saved=await apiRequest(`/roadmaps/${d.apiRoadmapId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(proposalForSave(d))});if(!draftOnly)await apiRequest(`/roadmaps/${d.apiRoadmapId}/approve`,{method:'POST'});let course=state.courses.find(x=>x.id===d.apiCourseId);if(!course){course={id:d.apiCourseId,ownerId:'instructor',createdAt:d.createdAt};state.courses.push(course)}Object.assign(course,{apiCourseId:d.apiCourseId,name:d.name,description:d.description,learnerLevel:d.learnerLevel,learningGoals:d.learningGoals.split(/[\n,]/).map(x=>x.trim()).filter(Boolean),status:draftOnly?'draft':'active',groups:d.groups.map(g=>({...g,id:g.apiGroupId||g.id,courseId:d.apiCourseId,status:'active'})),materials:d.materials.map(m=>({...m,courseId:d.apiCourseId})),topics:d.topics.map((x,i)=>({...x,sessionId:saved.sessions?.find(s=>s.stable_id===x.id)?.id||null,courseId:d.apiCourseId,sequenceIndex:i+1,status:'planned'})),edges:d.edges.map(([a,b])=>({id:`${a}:${b}`,sourceTopicId:a,targetTopicId:b})),version:saved.version_number,approvedAt:draftOnly?null:new Date().toISOString(),progress:{}});state.selectedCourse=course.id;state.selectedGroup=course.groups[0]?.id||null;if(draftOnly){d.status='draft';persist()}else{state.draft=null;persist()}state.screen=draftOnly?'dashboard':'roadmap';state.showDetail=!draftOnly;state.selectedNode=course.topics[0]?.id||null;render();notify(draftOnly?'Roadmap draft saved. It remains inactive.':'Roadmap approved and activated.')}catch(e){notify(`Could not save roadmap: ${e.message}`)}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){case'create':case'new-course':createDraft();break;case'dashboard':state.screen='dashboard';render();break;case'courses':state.screen='dashboard';render();break;case'open-session':state.screen='roadmap';state.selectedNode=b.dataset.id;state.showDetail=true;render();break;case'toggle-progress':await toggleProgress(b.dataset.id);break;case'roadmap':if(!selectedCourse()){notify('Create or select a course to open its roadmap.');return}state.screen='roadmap';state.showDetail=true;state.selectedNode=state.selectedNode||selectedCourse()?.topics[0]?.id||null;render();break;case'materials':case'approvals':case'assistant':case'roadmap-list':case'roadmap-progress':notify('This section is not part of the current prototype.');break;case'how':document.body.insertAdjacentHTML('beforeend',`<div class="overlay" data-modal="how"><div class="modal"><h2>How TeachFlow works</h2><p class="muted">Add a course and the materials you already use. TeachFlow proposes connected topics and sessions. You review and edit the roadmap before approving it. Each group then tracks its own progress.</p><button class="btn primary" data-action="close-modal">Got it</button></div></div>`);break;case'close-modal':document.querySelector('[data-modal]')?.remove();break;case'close-wizard':saveStepFields();persist();state.screen='dashboard';render();break;case'continue':continueWizard();break;case'back':if(state.step===5){state.step=3;state.draft.step=3}else if(state.step>1){state.step--;state.draft.step=state.step}persist();render();break;case'add-group':saveStepFields();state.draft.groups.push({id:id(),name:`Group ${state.draft.groups.length+1}`,schedule:'',duration:'',startDate:''});persist();render();break;case'remove-group':state.draft.groups=state.draft.groups.filter(g=>g.id!==b.dataset.id);persist();render();break;case'extract':extractSchedule();break;case'accept-extract':state.draft.groups.push(...(state.extractPreview||[]));state.extractPreview=null;persist();render();break;case'clear-extract':state.extractPreview=null;render();break;case'remove-file':await removeMaterial(Number(b.dataset.index));break;case'retry-gen':startGeneration();break;case'select-node':reviewEdit('edit');state.selectedNode=b.dataset.id;state.showDetail=true;render();break;case'save-draft':reviewEdit('edit');await approve(true);break;case'approve':reviewEdit('edit');await approve(false);break;case'open-course':state.selectedCourse=b.dataset.id;state.selectedGroup=selectedCourse()?.groups[0]?.id||null;state.screen='roadmap';state.selectedNode=selectedCourse()?.topics[0]?.id;state.showDetail=true;persist();render();break;case'zoom-in':zoom(1.15);break;case'zoom-out':zoom(.87);break;case'fit':zoom(1,true);break;case'add-topic':{reviewEdit('edit');const current=state.draft.topics.find(x=>x.id===state.selectedNode);if(!current)break;const peers=state.draft.topics.filter(x=>x.topicStableId===current.topicStableId),sequenceIndex=Math.max(...peers.map(x=>x.sequenceIndex||state.draft.roadmapProposal.sessions.find(s=>s.stable_id===x.id)?.sequence_index||1))+1,t={id:id(),topicStableId:current.topicStableId,topicTitle:current.topicTitle,sequenceIndex,title:'New session',description:'',objectives:current.objectives||[],minutes:90};state.draft.topics.push(t);state.draft.edges.push([peers[peers.length-1].id,t.id]);state.selectedNode=t.id;persist();render();break}case'delete-topic':{const deps=state.draft.edges.filter(x=>x[0]===b.dataset.id||x[1]===b.dataset.id);if(deps.length&&!confirm('This session has prerequisite relationships. Delete it and remove those relationships?'))return;state.draft.topics=state.draft.topics.filter(x=>x.id!==b.dataset.id);state.draft.edges=state.draft.edges.filter(x=>x[0]!==b.dataset.id&&x[1]!==b.dataset.id);state.selectedNode=state.draft.topics[0]?.id;persist();render();break}case'regen-topic':notify('Section regeneration is not available.');break}}
);
document.addEventListener('change',e=>{if(e.target.id==='course-select'){state.selectedCourse=e.target.value;const c=selectedCourse();state.selectedGroup=c?.groups[0]?.id||null;state.selectedNode=c?.topics[0]?.id||null;state.showDetail=false;persist();render()}if(e.target.id==='group-select'){state.selectedGroup=e.target.value;state.selectedNode=null;persist();render()}});
document.addEventListener('input',e=>{if(e.target.id==='edit-title'||e.target.id==='edit-desc'||e.target.id==='edit-objectives'||e.target.id==='edit-minutes'){/* edits are committed before navigation or approval */}});
function zoom(factor=1,fit=false){const el=document.getElementById('roadmap-inner'),wrap=document.getElementById('roadmap-scroll');if(!el||!wrap)return;const previous=Number(el.dataset.zoom||1),next=fit?Math.max(.35,Math.min(1,(wrap.clientWidth-32)/900,(wrap.clientHeight-32)/540)):Math.max(.45,Math.min(1.6,previous*factor)),cx=(wrap.scrollLeft+wrap.clientWidth/2)/previous,cy=(wrap.scrollTop+wrap.clientHeight/2)/previous;el.dataset.zoom=String(next);el.style.transform=`scale(${next})`;el.parentElement.style.width=`${900*next}px`;el.parentElement.style.height=`${540*next}px`;if(fit)wrap.scrollTo({left:Math.max(0,(900*next-wrap.clientWidth)/2),top:Math.max(0,(540*next-wrap.clientHeight)/2),behavior:'smooth'});else requestAnimationFrame(()=>wrap.scrollTo({left:Math.max(0,cx*next-wrap.clientWidth/2),top:Math.max(0,cy*next-wrap.clientHeight/2),behavior:'smooth'}))}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='resume-draft'){openDraft()}if(b.dataset.action==='sample'){state.courses=[JSON.parse(JSON.stringify(demo))];state.selectedCourse=demo.id;state.selectedGroup=demo.groups[0].id;state.screen='roadmap';state.showDetail=true;state.selectedNode=demo.topics[2].id;persist();render()}});
render();
})();
